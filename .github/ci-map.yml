{
  "version": 1,
  "mode_order": {"go_mode": ["none","selected","full"],"web_mode": ["none","build","full"],"database_mode": ["none","selected","full"]},
  "rules": [
    {
      "name": "ci-self",
      "patterns": [".github/**","scripts/ci/**","scripts/check_*.sh","scripts/test_*.sh"],
      "effects": {"ci": true}
    },
    {
      "name": "documentation",
      "patterns": ["docs/**","README.md","AGENTS.md","CLAUDE.md","SECURITY.md"],
      "effects": {}
    },
    {
      "name": "web-source",
      "patterns": ["web/**"],
      "effects": {"web": true,"web_mode": "full"}
    },
    {
      "name": "web-lock",
      "patterns": ["package.json","package-lock.json"],
      "effects": {"web": true,"web_audit": true,"web_mode": "full"}
    },
    {
      "name": "openapi-source",
      "patterns": ["api/openapi.yaml","api/oapi-codegen*.yaml"],
      "effects": {"api": true,"web": true,"web_mode": "build"}
    },
    {
      "name": "openapi-go-generated",
      "patterns": ["internal/api/generated/**","internal/api/candidate/generated/**"],
      "effects": {"api": true,"go": true,"go_groups": ["composition"],"go_mode": "selected"}
    },
    {
      "name": "openapi-web-generated",
      "patterns": ["web/src/api/generated/**"],
      "effects": {"api": true,"web": true,"web_mode": "build"}
    },
    {
      "name": "openapi-contract-tool",
      "patterns": ["tools/openapi-contract/**"],
      "effects": {"api": true}
    },
    {
      "name": "migrations",
      "patterns": ["migrations/**"],
      "effects": {"database": true,"database_mode": "selected","sqlc": true}
    },
    {
      "name": "sqlc-root",
      "patterns": ["sqlc.yaml","sqlc.yml"],
      "effects": {"database": true,"database_mode": "full","sqlc": true}
    },
    {
      "name": "go-dependencies",
      "patterns": ["go.mod","go.sum","tools/**"],
      "effects": {"go": true,"go_mode": "full","shared": true,"vulnerability": true}
    },
    {
      "name": "ci-go-tools",
      "patterns": ["scripts/ownership/**"],
      "effects": {"go": true,"go_mode": "full","shared": true}
    },
    {
      "name": "shared-platform",
      "patterns": ["internal/platform/**","internal/*/port/**"],
      "effects": {"go": true,"go_mode": "full","shared": true}
    },
    {
      "name": "security-core",
      "patterns": [".gitleaks.toml","SECURITY.md","internal/auth/**","internal/config/**","internal/gateway/**","cmd/aicrm/legacy_auth*.go","cmd/aicrm/legacy_config*.go"],
      "effects": {"security_expanded": true}
    },
    {
      "name": "composition",
      "patterns": ["cmd/aicrm/**"],
      "effects": {"go": true,"go_groups": ["composition"],"go_mode": "selected"}
    },
    {
      "name": "dm01-composition",
      "patterns": ["cmd/aicrm-dm01/**","acceptance/dm01/**","acceptance/contact/dm01_migration_pg16.sh","migrations/00072_legacy_contact_identity_import.sql","internal/contact/migration/dm01*","internal/contact/store/dm01*","internal/contact/store/acceptancefixture/dm01.go","internal/contact/store/historical_import_repository.go","internal/contact/store/queries/dm01_acceptance.sql","internal/contact/store/queries/historical_import.sql","internal/identity/store/repository.go"],
      "effects": {"go": true,"go_groups": ["contact","identity"],"go_mode": "selected","database": true,"database_groups": ["dm01"],"database_mode": "selected","sqlc": true}
    },
    {
      "name": "media-go",
      "patterns": ["internal/media/**","acceptance/media/**"],
      "effects": {"go": true,"go_groups": ["media"],"go_mode": "selected"}
    },
    {
      "name": "media-database",
      "patterns": ["internal/media/store/**","acceptance/media/**"],
      "effects": {"database": true,"database_groups": ["media"],"database_mode": "selected","sqlc": true}
    },
    {
      "name": "acceptance-automation-fixture",
      "patterns": ["acceptance/automationfixture/**"],
      "effects": {"go": true,"go_groups": ["automation"],"go_mode": "selected","database": true,"database_groups": ["automation"],"database_mode": "selected"}
    },
    {
      "name": "acceptance-contact-fixture",
      "patterns": ["acceptance/contactfixture/**"],
      "effects": {"go": true,"go_groups": ["contact"],"go_mode": "selected","database": true,"database_groups": ["contact"],"database_mode": "selected"}
    },
    {
      "name": "acceptance-media-fixture",
      "patterns": ["acceptance/mediafixture/**"],
      "effects": {"go": true,"go_groups": ["automation","contact","media"],"go_mode": "selected","database": true,"database_groups": ["automation","contact","media"],"database_mode": "selected"}
    },
    {
      "name": "domain-adminops",
      "patterns": ["internal/adminops/**","acceptance/adminops/**"],
      "effects": {"go": true,"go_groups": ["adminops"],"go_mode": "selected"}
    },
    {
      "name": "domain-ai",
      "patterns": ["internal/ai/**","acceptance/ai/**"],
      "effects": {"go": true,"go_groups": ["ai"],"go_mode": "selected"}
    },
    {
      "name": "domain-auth",
      "patterns": ["internal/auth/**","acceptance/auth/**"],
      "effects": {"go": true,"go_groups": ["auth"],"go_mode": "selected"}
    },
    {
      "name": "domain-automation",
      "patterns": ["internal/automation/**","acceptance/automation/**"],
      "effects": {"go": true,"go_groups": ["automation"],"go_mode": "selected"}
    },
    {
      "name": "domain-config",
      "patterns": ["internal/config/**","acceptance/config/**"],
      "effects": {"go": true,"go_groups": ["config"],"go_mode": "selected"}
    },
    {
      "name": "domain-contact",
      "patterns": ["internal/contact/**","acceptance/contact/**"],
      "effects": {"go": true,"go_groups": ["contact"],"go_mode": "selected"}
    },
    {
      "name": "domain-coupon",
      "patterns": ["internal/coupon/**","acceptance/coupon/**"],
      "effects": {"go": true,"go_groups": ["coupon"],"go_mode": "selected"}
    },
    {
      "name": "domain-events",
      "patterns": ["internal/events/**","acceptance/events/**"],
      "effects": {"go": true,"go_groups": ["events"],"go_mode": "selected"}
    },
    {
      "name": "domain-externaleffects",
      "patterns": ["internal/externaleffects/**","acceptance/externaleffects/**"],
      "effects": {"go": true,"go_groups": ["externaleffects"],"go_mode": "selected"}
    },
    {
      "name": "domain-gateway",
      "patterns": ["internal/gateway/**","acceptance/gateway/**"],
      "effects": {"go": true,"go_groups": ["gateway"],"go_mode": "selected"}
    },
    {
      "name": "domain-groupops",
      "patterns": ["internal/groupops/**","acceptance/groupops/**"],
      "effects": {"go": true,"go_groups": ["groupops"],"go_mode": "selected"}
    },
    {
      "name": "domain-identity",
      "patterns": ["internal/identity/**","acceptance/identity/**"],
      "effects": {"go": true,"go_groups": ["identity"],"go_mode": "selected"}
    },
    {
      "name": "domain-migration",
      "patterns": ["internal/migration/**","internal/datamigration/**","cmd/aicrm-v1-import/**","cmd/aicrm-v1-domain-import/**","scripts/datamigration_manifest/**","acceptance/datamigration/**"],
      "effects": {"go": true,"go_groups": ["migration"],"go_mode": "selected"}
    },
    {
      "name": "domain-operationcycle",
      "patterns": ["internal/operationcycle/**","acceptance/operationcycle/**"],
      "effects": {"go": true,"go_groups": ["operationcycle"],"go_mode": "selected"}
    },
    {
      "name": "domain-ops",
      "patterns": ["internal/ops/**","acceptance/ops/**"],
      "effects": {"go": true,"go_groups": ["ops"],"go_mode": "selected"}
    },
    {
      "name": "domain-order",
      "patterns": ["internal/order/**","acceptance/order/**"],
      "effects": {"go": true,"go_groups": ["order"],"go_mode": "selected"}
    },
    {
      "name": "domain-outbound",
      "patterns": ["internal/outbound/**","acceptance/outbound/**"],
      "effects": {"go": true,"go_groups": ["outbound"],"go_mode": "selected"}
    },
    {
      "name": "domain-product",
      "patterns": ["internal/product/**","acceptance/product/**"],
      "effects": {"go": true,"go_groups": ["product"],"go_mode": "selected"}
    },
    {
      "name": "domain-radar",
      "patterns": ["internal/radar/**","acceptance/radar/**"],
      "effects": {"go": true,"go_groups": ["radar"],"go_mode": "selected"}
    },
    {
      "name": "radar-database",
      "patterns": ["internal/radar/store/**","acceptance/radar/**"],
      "effects": {"database": true,"database_groups": ["radar"],"database_mode": "selected","sqlc": true}
    },
    {
      "name": "domain-pushcenter",
      "patterns": ["internal/pushcenter/**","acceptance/pushcenter/**"],
      "effects": {"go": true,"go_groups": ["pushcenter"],"go_mode": "selected"}
    },
    {
      "name": "domain-segment",
      "patterns": ["internal/segment/**","acceptance/segment/**"],
      "effects": {"go": true,"go_groups": ["segment"],"go_mode": "selected"}
    },
    {
      "name": "domain-stats",
      "patterns": ["internal/stats/**","acceptance/stats/**"],
      "effects": {"go": true,"go_groups": ["stats"],"go_mode": "selected"}
    },
    {
      "name": "domain-survey",
      "patterns": ["internal/survey/**","acceptance/survey/**"],
      "effects": {"go": true,"go_groups": ["survey"],"go_mode": "selected"}
    },
    {
      "name": "domain-wecom",
      "patterns": ["internal/wecom/**","acceptance/wecom/**"],
      "effects": {"go": true,"go_groups": ["wecom"],"go_mode": "selected"}
    },
    {
      "name": "selected-domain-database",
      "patterns": [
        "internal/adminops/store/**","acceptance/adminops/**",
        "internal/auth/store/**","acceptance/auth/**",
        "internal/automation/store/**","acceptance/automation/**",
        "internal/contact/store/**","acceptance/contact/**",
        "internal/coupon/store/**","acceptance/coupon/**",
        "internal/events/store/**","acceptance/events/**",
        "internal/externaleffects/store/**","acceptance/externaleffects/**",
        "internal/groupops/store/**","acceptance/groupops/**",
        "internal/identity/store/**","acceptance/identity/**",
        "internal/migration/store/**","acceptance/datamigration/**",
        "internal/operationcycle/store/**","acceptance/operationcycle/**",
        "internal/order/store/**","acceptance/order/**",
        "internal/outbound/store/**","acceptance/outbound/**",
        "internal/product/store/**","acceptance/product/**",
        "internal/pushcenter/store/**","acceptance/pushcenter/**",
        "internal/segment/store/**","acceptance/segment/**",
        "internal/stats/store/**","acceptance/stats/**",
        "internal/survey/store/**","acceptance/survey/**",
        "internal/wecom/store/**","acceptance/wecom/**"
      ],
      "effects": {"database": true,"database_mode": "selected","sqlc": true}
    },
    {
      "name": "database-adminops",
      "patterns": ["internal/adminops/store/**","acceptance/adminops/**"],
      "effects": {"database": true,"database_groups": ["adminops"],"database_mode": "selected"}
    },
    {
      "name": "database-auth",
      "patterns": ["internal/auth/store/**","acceptance/auth/**"],
      "effects": {"database": true,"database_groups": ["auth"],"database_mode": "selected"}
    },
    {
      "name": "database-automation",
      "patterns": ["internal/automation/store/**","acceptance/automation/**"],
      "effects": {"database": true,"database_groups": ["automation"],"database_mode": "selected"}
    },
    {
      "name": "database-contact",
      "patterns": ["internal/contact/store/**","acceptance/contact/**"],
      "effects": {"database": true,"database_groups": ["contact"],"database_mode": "selected"}
    },
    {
      "name": "database-coupon",
      "patterns": ["internal/coupon/store/**","acceptance/coupon/**"],
      "effects": {"database": true,"database_groups": ["coupon"],"database_mode": "selected"}
    },
    {
      "name": "database-identity",
      "patterns": ["internal/identity/store/**","acceptance/identity/**"],
      "effects": {"database": true,"database_groups": ["identity"],"database_mode": "selected"}
    },
    {
      "name": "database-migration",
      "patterns": ["internal/migration/store/**","internal/migration/v1archive/**","internal/migration/v1domain/**","cmd/aicrm-v1-import/**","cmd/aicrm-v1-domain-import/**","migrations/00107_v1_full_data_archive.sql","migrations/00108_v1_domain_import_receipts.sql","acceptance/datamigration/**"],
      "effects": {"database": true,"database_groups": ["migration"],"database_mode": "selected"}
    },
    {
      "name": "database-events",
      "patterns": ["internal/events/store/**","acceptance/events/**"],
      "effects": {"database": true,"database_groups": ["events"],"database_mode": "selected"}
    },
    {
      "name": "database-externaleffects",
      "patterns": ["internal/externaleffects/store/**","acceptance/externaleffects/**"],
      "effects": {"database": true,"database_groups": ["externaleffects"],"database_mode": "selected"}
    },
    {
      "name": "database-groupops",
      "patterns": ["internal/groupops/store/**","acceptance/groupops/**"],
      "effects": {"database": true,"database_groups": ["groupops"],"database_mode": "selected"}
    },
    {
      "name": "database-operationcycle",
      "patterns": ["internal/operationcycle/store/**","acceptance/operationcycle/**"],
      "effects": {"database": true,"database_groups": ["operationcycle"],"database_mode": "selected"}
    },
    {
      "name": "database-order",
      "patterns": ["internal/order/store/**","acceptance/order/**"],
      "effects": {"database": true,"database_groups": ["order"],"database_mode": "selected"}
    },
    {
      "name": "database-outbound",
      "patterns": ["internal/outbound/store/**","acceptance/outbound/**"],
      "effects": {"database": true,"database_groups": ["outbound"],"database_mode": "selected"}
    },
    {
      "name": "database-product",
      "patterns": ["internal/product/store/**","acceptance/product/**"],
      "effects": {"database": true,"database_groups": ["product"],"database_mode": "selected"}
    },
    {
      "name": "database-pushcenter",
      "patterns": ["internal/pushcenter/store/**","acceptance/pushcenter/**"],
      "effects": {"database": true,"database_groups": ["pushcenter"],"database_mode": "selected"}
    },
    {
      "name": "database-segment",
      "patterns": ["internal/segment/store/**","acceptance/segment/**"],
      "effects": {"database": true,"database_groups": ["segment"],"database_mode": "selected"}
    },
    {
      "name": "database-stats",
      "patterns": ["internal/stats/store/**","acceptance/stats/**"],
      "effects": {"database": true,"database_groups": ["stats"],"database_mode": "selected"}
    },
    {
      "name": "database-survey",
