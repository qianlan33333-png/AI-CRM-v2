openapi: 3.0.3
info:
  title: AI-CRM v2 API
  version: 0.2.0-g1-frozen
  description: Canonical HTTP contract. Generated code must not be edited. The ten P1 core operations are frozen by G1-D01.
security:
  - AdminSession: []
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/customers:
    get:
      tags: [p1-core-candidate]
      operationId: listCustomers
      summary: List customers using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0609]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customer page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/customers/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p1-core-candidate]
      operationId: getCustomer
      summary: Get a channel-neutral customer by OneID
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0619, LEGACY-API-0743]
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [p1-core-candidate]
      operationId: updateCustomer
      summary: Update customer-owned profile fields
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0736]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/customers/{customer_id}/events:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p1-core-candidate]
      operationId: listCustomerEvents
      summary: List append-only customer events using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0620, LEGACY-API-0739, LEGACY-API-0745]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customer event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEventListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/identity/resolve:
    post:
      tags: [p1-core-candidate]
      operationId: resolveIdentity
      summary: Resolve one scoped identity without implicit creation
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0355, LEGACY-API-0680]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIdentityRequest"
      responses:
        "200":
          description: Found, not-found, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/identity/bind:
    post:
      tags: [p1-core-candidate]
      operationId: bindIdentity
      summary: Bind a scoped identity to a channel-neutral customer
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0709]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindIdentityRequest"
      responses:
        "200":
          description: Bind or merge-policy result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindIdentityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/identity/ingest:
    post:
      tags: [p1-core-candidate]
      operationId: ingestIdentityEvent
      summary: Attribute or persist an external event without guessing identity
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0780]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestIdentityEventRequest"
      responses:
        "200":
          description: Attributed, pending, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestIdentityEventResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/session:
    get:
      tags: [p1-core-candidate]
      operationId: getAuthSession
      summary: Return the authenticated admin principal
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0758]
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [p1-core-candidate]
      operationId: logoutAdmin
      summary: Invalidate the current admin session
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0760]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Session invalidated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/config/overview:
    get:
      tags: [p1-core-candidate]
      operationId: getAdminConfigOverview
      summary: List non-secret configuration readiness
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0269]
      responses:
        "200":
          description: Non-secret configuration readiness only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigOverviewResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    BadRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Principal lacks the capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Current state conflicts with the command.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, is_deleted, extra, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, nullable: true }
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        added_at: { type: string, format: date-time, nullable: true }
        last_interact_at: { type: string, format: date-time, nullable: true }
        is_deleted: { type: boolean }
        extra: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, nullable: true }
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        extra: { type: object, additionalProperties: true }
    CustomerListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
    CustomerEvent:
      type: object
      additionalProperties: false
      required: [id, customer_id, event_type, payload, occurred_at, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        customer_id: { type: integer, format: int64, minimum: 1 }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CustomerEventListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CustomerEvent" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
    IdentityRef:
      type: object
      additionalProperties: false
      required: [type, scope, value, assurance, source]
      properties:
        type:
          type: string
          enum: [wecom_external_userid, unionid, mp_openid, oa_openid, alipay_user_id, phone, ext]
        scope: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        assurance: { type: string, enum: [verified, declared] }
        source: { type: string, minLength: 1 }
    ResolveIdentityRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties: { ref: { $ref: "#/components/schemas/IdentityRef" } }
    ResolveIdentityResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [found, not_found, conflict] }
        customer_id: { type: integer, format: int64, minimum: 1, nullable: true }
    BindIdentityRequest:
      type: object
      additionalProperties: false
      required: [customer_id, ref]
      properties:
        customer_id: { type: integer, format: int64, minimum: 1 }
        ref: { $ref: "#/components/schemas/IdentityRef" }
    BindIdentityResponse:
      type: object
      additionalProperties: false
      required: [status, customer_id]
      properties:
        status: { type: string, enum: [bound, already_bound, merged, manual_review, rejected] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        primary_customer_id: { type: integer, format: int64, minimum: 1, nullable: true }
        merge_audit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        review_id: { type: integer, format: int64, minimum: 1, nullable: true }
    IngestIdentityEventRequest:
      type: object
      additionalProperties: false
      required: [refs, event_type, payload, source, occurred_at, idempotency_key]
      properties:
        refs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/IdentityRef" } }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        source: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        idempotency_key: { type: string, minLength: 1 }
    IngestIdentityEventResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [attributed, pending, conflict] }
        customer_id: { type: integer, format: int64, minimum: 1, nullable: true }
        event_id: { type: integer, format: int64, minimum: 1, nullable: true }
        pending_event_id: { type: integer, format: int64, minimum: 1, nullable: true }
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [admin_user_id, role]
      properties:
        admin_user_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [admin, ops, sales] }
        staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
    AdminConfigEntry:
      type: object
      additionalProperties: false
      required: [key, configured, source_status]
      properties:
        key: { type: string, minLength: 1 }
        configured: { type: boolean }
        source_status: { type: string, enum: [configured, missing, invalid] }
    AdminConfigOverviewResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminConfigEntry" } }
