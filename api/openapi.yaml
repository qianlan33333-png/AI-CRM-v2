        definition_version: { type: integer, format: int64, minimum: 1 }
        submission_id: { type: integer, format: int64, minimum: 1 }
    PublicSurveySubmissionResponse:
      type: object
      additionalProperties: false
      required: [receipt, result_token]
      properties:
        receipt: { $ref: "#/components/schemas/PublicSurveySubmissionReceipt" }
        result_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: POST-body-only opaque result credential; it is never accepted in a query parameter or returned by lookup responses.
    PublicSurveyResultQueryRequest:
      type: object
      additionalProperties: false
      required: [result_token]
      properties:
        result_token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    PublicSurveyResult:
      type: object
      additionalProperties: false
      required: [submission_id, definition_version, submitted_at, local_only, external_executed]
      properties:
        submission_id: { type: integer, format: int64, minimum: 1 }
        definition_version: { type: integer, format: int64, minimum: 1 }
        submitted_at: { type: string, format: date-time }
        local_only: { type: boolean, enum: [true] }
        external_executed: { type: boolean, enum: [false] }
    PublicSurveyPublishRequest:
      type: object
      additionalProperties: false
      required: [expected_questionnaire_version]
      properties:
        expected_questionnaire_version: { type: integer, format: int64, minimum: 1 }
    PublicSurveyDisableRequest:
      type: object
      additionalProperties: false
      required: [expected_definition_version]
      properties:
        expected_definition_version: { type: integer, format: int64, minimum: 1 }
    PublicSurveyManagementResponse:
      type: object
      additionalProperties: false
      required: [questionnaire_id, slug, definition_version, state]
      properties:
        questionnaire_id: { type: integer, format: int64, minimum: 1 }
        slug: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9][a-z0-9-]{0,119}$' }
