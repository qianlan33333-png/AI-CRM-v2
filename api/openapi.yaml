  /api/admin/automation-conversion/agent-runs:
    get:
      tags: [p4-automation-compat]
      operationId: listAutomationTriggerRuns
      summary: List real D01 Automation trigger receipts through the frozen legacy path
      x-legacy-mapping-ids: [LEGACY-API-0141]
      x-p4-decision-evidence: P4-W0-D01-2026-08-14
