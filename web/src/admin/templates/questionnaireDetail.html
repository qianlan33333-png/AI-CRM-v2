          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div><div style="font-size:12px;color:#8F959E">运营 / 问卷</div><div style="font-size:16px;font-weight:600">{{ questionnaireFormPage.title }}</div></div>
            <div style="display:flex;gap:8px"><button onClick="{{ go.questionnaires }}" style="height:30px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;font-size:13px;cursor:pointer">返回列表</button><button onClick="{{ questionnaireFormPage.save }}" style="height:30px;padding:0 14px;border:0;border-radius:6px;background:#3370ff;color:#fff;font-size:13px;cursor:pointer">保存定义</button></div>
          </div>
          <div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
            <div style="max-width:1100px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">问卷定义</div>
              <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">内部名称<input id="questionnaireName" value="{{ questionnaireFormPage.item.internalName }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">公开标题<input id="questionnaireTitle" value="{{ questionnaireFormPage.item.title }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">公开 slug<input id="questionnaireSlug" value="{{ questionnaireFormPage.item.slug }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">答题展示方式<select id="questionnaireDisplay" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;background:#fff;font-size:13px"><sc-if value="{{ questionnaireFormPage.item.allSelected }}"><option value="all_in_one" selected="selected">整页答题</option><option value="one_by_one">逐题答题</option></sc-if><sc-if value="{{ questionnaireFormPage.item.oneSelected }}"><option value="all_in_one">整页答题</option><option value="one_by_one" selected="selected">逐题答题</option></sc-if></select></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">说明<textarea id="questionnaireDescription" rows="3" style="border:1px solid #DEE0E3;border-radius:6px;padding:8px 10px;font-size:13px">{{ questionnaireFormPage.item.description }}</textarea></label>
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#646A73"><sc-if value="{{ questionnaireFormPage.item.assessmentEnabled }}"><input id="questionnaireAssessmentEnabled" type="checkbox" checked="checked"></sc-if><sc-if value="{{ questionnaireFormPage.item.assessmentDisabled }}"><input id="questionnaireAssessmentEnabled" type="checkbox"></sc-if>启用测评</label>
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#646A73"><sc-if value="{{ questionnaireFormPage.item.off }}"><input id="questionnaireDisabled" type="checkbox" checked="checked"></sc-if><sc-if value="{{ questionnaireFormPage.item.enabledState }}"><input id="questionnaireDisabled" type="checkbox"></sc-if>保存为停用状态</label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">题目 JSON（严格使用 LegacyQuestionnaireQuestion DTO）<textarea id="questionnaireQuestions" rows="18" spellcheck="false" style="border:1px solid #DEE0E3;border-radius:6px;padding:10px 12px;font-size:12px;line-height:19px;font-family:ui-monospace,Menlo,monospace">{{ questionnaireFormPage.item.questionsJson }}</textarea></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">测评配置 JSON<textarea id="questionnaireAssessmentConfig" rows="6" spellcheck="false" style="border:1px solid #DEE0E3;border-radius:6px;padding:10px 12px;font-size:12px;line-height:19px;font-family:ui-monospace,Menlo,monospace">{{ questionnaireFormPage.item.assessmentConfigJson }}</textarea></label>
              </div>
            </div>
            <div style="max-width:1100px;padding:14px 16px;border:1px solid #D6E4FF;border-radius:8px;background:#F5F8FF;font-size:13px;color:#245BDB;line-height:20px">保存只写入白名单问卷定义；已提交答案保持只读，不创建外推任务。</div>
          </div>
