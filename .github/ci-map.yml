    },
    {
      "name": "database-wecom",
      "patterns": ["internal/wecom/store/**","acceptance/wecom/**"],
      "effects": {"database": true,"database_groups": ["wecom"],"database_mode": "selected"}
    },
    {
      "name": "other-domain-store",
      "patterns": ["internal/*/store/**"],
      "exclude": [
        "internal/adminops/store/**","internal/auth/store/**","internal/automation/store/**",
        "internal/contact/store/**","internal/coupon/store/**","internal/events/store/**","internal/identity/store/**","internal/migration/store/**",
        "internal/media/store/**","internal/operationcycle/store/**","internal/order/store/**",
        "internal/outbound/store/**","internal/product/store/**","internal/pushcenter/store/**",
        "internal/segment/store/**","internal/stats/store/**","internal/survey/store/**",
        "internal/wecom/store/**"
      ],
      "effects": {"database": true,"database_mode": "full","sqlc": true}
    },
    {
      "name": "root-ci-entrypoints",
      "patterns": ["Makefile","scripts/check_generated_sources.sh","scripts/run_ci_acceptance_manifest.sh"],
      "effects": {"ci": true,"go": true,"go_mode": "full","shared": true}
    }
  ]
}
