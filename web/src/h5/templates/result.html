<main style="flex:1;overflow:auto;padding:20px;background:#F5F6F7">
  <h1>问卷提交结果</h1>
  <sc-if value="{{ loading }}"><p role="status">正在查询真实提交结果…</p></sc-if>
  <sc-if value="{{ error }}"><p role="alert" data-h5-error style="color:#D83931">{{ error }}</p></sc-if>
  <sc-if value="{{ canRetry }}"><button type="button" onClick="{{ act.retry }}">重试查询</button></sc-if>
  <sc-if value="{{ result }}">
    <section data-h5-result style="padding:18px;background:#fff;border:1px solid #DEE0E3;border-radius:12px">
      <h2>提交记录已确认</h2>
      <dl><dt>提交编号</dt><dd>{{ result.submission_id }}</dd><dt>定义版本</dt><dd>{{ result.definition_version }}</dd><dt>提交时间</dt><dd>{{ result.submitted_at }}</dd><dt>仅本地处理</dt><dd>{{ result.local_only }}</dd><dt>已执行外部效果</dt><dd>{{ result.external_executed }}</dd></dl>
      <p>当前结果契约不提供测评分数、课程推荐或支付状态。</p>
    </section>
  </sc-if>
</main>
