name: security / secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: security / secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" version | grep -Fx "$GITLEAKS_VERSION"
          echo "$bin_dir" >>"$GITHUB_PATH"
      - name: Scan repository history
        run: gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan forbidden sensitive paths
        run: scripts/scan_sensitive_paths.sh
      - name: Verify slice bundle security cases
        run: scripts/test_build_slice_bundle.sh
