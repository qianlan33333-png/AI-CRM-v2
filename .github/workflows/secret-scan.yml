name: security / secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: security / secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact-main verification mode
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci_promotion_decision.sh
      - name: Install pinned gitleaks
        if: steps.promotion.outputs.mode == 'full'
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" version | grep -Fx "$GITLEAKS_VERSION"
          echo "$bin_dir" >>"$GITHUB_PATH"
      - name: Scan repository history
        if: steps.promotion.outputs.mode == 'full'
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Verify gitleaks false-positive boundary
        if: steps.promotion.outputs.mode == 'full'
        run: scripts/test_gitleaks_config.sh
      - name: Scan forbidden sensitive paths
        if: steps.promotion.outputs.mode == 'full'
        run: scripts/scan_sensitive_paths.sh
      - name: Verify slice bundle security cases
        if: steps.promotion.outputs.mode == 'full'
        run: scripts/test_build_slice_bundle.sh
      - name: Verify promotion fingerprints
        if: steps.promotion.outputs.mode == 'promotion'
        env:
          CI_PROMOTION_AFFECTED_MANIFEST: ${{ steps.promotion.outputs.affected_manifest }}
        run: scripts/check_ci_promotion_smoke.sh
