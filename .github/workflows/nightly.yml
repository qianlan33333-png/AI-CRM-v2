name: ci / nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 1-31 1-12 0-6"
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-nightly-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  BASH_ENV: ""
  ENV: ""
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  full_regression:
    name: ci / nightly-full-regression
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.target.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Resolve tested commit
        id: target
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$TARGET_SHA" >>"$GITHUB_OUTPUT"
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.target.outputs.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
          token: ''
      - name: Install pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - name: Install pinned gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" version | grep -Fx "$GITLEAKS_VERSION"
          echo "$bin_dir" >>"$GITHUB_PATH"
      - name: Create DM01 source and target databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres -T template0 aicrm_test_dm01_source
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres -T template0 aicrm_test_dm01_target
      - name: Run full nightly suite
        env:
          CI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          DM01_SOURCE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test_dm01_source?sslmode=disable
          DM01_TARGET_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test_dm01_target?sslmode=disable
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: QUERY_PLAN_BASE_SHA="$(git rev-parse HEAD^)" QUERY_PLAN_HEAD_SHA="$(git rev-parse HEAD)" scripts/ci/run_full_regression.sh

  publish_block_compatibility:
    name: ci / publish-block-compatibility
    needs: full_regression
    if: ${{ always() && needs.full_regression.outputs.tested_sha != '' }}
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish block compatibility status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ needs.full_regression.result }}
          TESTED_SHA: ${{ needs.full_regression.outputs.tested_sha }}
        run: |
          case "$JOB_STATUS" in
            success)
              state="success"
              description="Full Nightly passed for this commit"
              ;;
            failure|cancelled)
              state="failure"
              description="Full Nightly did not pass for this commit"
              ;;
            *)
              state="error"
              description="Full Nightly ended without a conclusive result"
              ;;
          esac
          payload="$(STATE="$state" DESCRIPTION="$description" python3 -c 'import json, os; print(json.dumps({"state": os.environ["STATE"], "context": "ci / block compatibility", "description": os.environ["DESCRIPTION"], "target_url": "{}/{}/actions/runs/{}".format(os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            --data "$payload"
