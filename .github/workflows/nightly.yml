name: ci / nightly

on:
  schedule:
    - cron: "17 18 1-31 1-12 0-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  BASH_ENV: ""
  ENV: ""
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  full_regression:
    name: ci / nightly-full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
          token: ''
      - name: Install pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - name: Install pinned gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" version | grep -Fx "$GITLEAKS_VERSION"
          echo "$bin_dir" >>"$GITHUB_PATH"
      - name: Create DM01 source and target databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres -T template0 aicrm_test_dm01_source
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres -T template0 aicrm_test_dm01_target
      - name: Run full nightly suite
        env:
          CI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          DM01_SOURCE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test_dm01_source?sslmode=disable
          DM01_TARGET_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test_dm01_target?sslmode=disable
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: QUERY_PLAN_BASE_SHA="$(git rev-parse HEAD^)" QUERY_PLAN_HEAD_SHA="$(git rev-parse HEAD)" scripts/ci/run_full_regression.sh
