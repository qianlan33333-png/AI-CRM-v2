          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div><div style="font-size:12px;color:#8F959E">交易 / 优惠券</div><div style="font-size:16px;font-weight:600">{{ couponFormPage.title }}</div></div>
            <div style="display:flex;gap:8px"><button onClick="{{ go.coupons }}" style="height:30px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;font-size:13px;cursor:pointer">返回列表</button><button onClick="{{ couponFormPage.saveDraft }}" style="height:30px;padding:0 12px;border:1px solid #3370ff;border-radius:6px;background:#fff;color:#245BDB;font-size:13px;cursor:pointer">保存草稿</button><button onClick="{{ couponFormPage.savePublish }}" style="height:30px;padding:0 14px;border:0;border-radius:6px;background:#3370ff;color:#fff;font-size:13px;cursor:pointer">保存并发布</button></div>
          </div>
          <div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
            <div style="max-width:960px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">OpenAPI 优惠券规则</div>
              <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">优惠券名称<input id="couponName" value="{{ couponFormPage.item.name }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">减免金额（元）<input id="couponDiscount" value="{{ couponFormPage.item.discount }}" inputmode="decimal" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">发行总量<input id="couponTotal" type="number" min="1" value="{{ couponFormPage.item.totalIssueLimit }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">单用户限领<input id="couponPerUser" type="number" min="1" value="{{ couponFormPage.item.perUserIssueLimit }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">有效期模式<select id="couponValidityMode" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;background:#fff;font-size:13px"><sc-if value="{{ couponFormPage.item.relativeSelected }}"><option value="relative_days" selected="selected">领取后相对天数</option><option value="fixed_range">固定时间范围</option></sc-if><sc-if value="{{ couponFormPage.item.fixedSelected }}"><option value="relative_days">领取后相对天数</option><option value="fixed_range" selected="selected">固定时间范围</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">领取开始<input id="couponClaimStart" type="datetime-local" value="{{ couponFormPage.item.claimStartsAtInput }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">领取结束<input id="couponClaimEnd" type="datetime-local" value="{{ couponFormPage.item.claimEndsAtInput }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">固定使用开始<input id="couponUseStart" type="datetime-local" value="{{ couponFormPage.item.useStartsAtInput }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">固定使用结束<input id="couponUseEnd" type="datetime-local" value="{{ couponFormPage.item.useEndsAtInput }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">领取后有效天数<input id="couponRelativeDays" type="number" min="1" value="{{ couponFormPage.item.relativeValidityDays }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">适用商品引用（逗号、空格或换行分隔）<textarea id="couponTargetRefs" rows="3" style="border:1px solid #DEE0E3;border-radius:6px;padding:8px 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace">{{ couponFormPage.item.targetRefsText }}</textarea></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">使用说明<textarea id="couponInstructions" rows="4" style="border:1px solid #DEE0E3;border-radius:6px;padding:8px 10px;font-size:13px">{{ couponFormPage.item.instructions }}</textarea></label>
              </div>
            </div>
            <div style="max-width:960px;padding:14px 16px;border:1px solid #D6E4FF;border-radius:8px;background:#F5F8FF;font-size:13px;color:#245BDB;line-height:20px">适用商品使用服务端 target_refs 原值，不在浏览器中猜测或转换商品编码。发布后停用、归档和草稿删除均由列表中的真实 lifecycle operation 执行。</div>
          </div>
