      cloud_campaign_touch_plan_steps: immutable_campaign_step_content_snapshot_without_material_reference
      cloud_campaign_touch_plan_receipts: actor_scoped_plan_event_bound_transactional_create_receipts
      cloud_campaign_touch_plan_reviews: campaign_owned_review_sidecar_with_cas_terminal_decision
      cloud_campaign_touch_plan_review_receipts: actor_scoped_durable_review_result_snapshot_receipts
