components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
    PaymentIdentitySession:
      type: apiKey
      in: cookie
      name: aicrm_payment_identity
      description: Opaque trusted payment-identity session; the server resolves its digest to a customer and never accepts caller-supplied customer identity.
    SidebarGrant:
      type: apiKey
      in: cookie
      name: aicrm_sidebar_grant
      description: Opaque owner-scoped sidebar grant; it is not interchangeable with a payment-identity session.
