<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
  <div><div style="font-size:12px;color:#8F959E">交易 / 周期商品</div><div style="font-size:16px;font-weight:600">{{ spProductFormPage.title }}</div></div>
  <div style="display:flex;gap:8px"><button onClick="{{ go.spProducts }}">返回列表</button><button onClick="{{ spProductFormPage.save }}" style="border:0;background:#3370ff;color:#fff">保存周期商品</button></div>
</div>
<div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
  <div style="max-width:900px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">周期商品当前信息</div>
    <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
      <label>商品编码<input id="spfCode" value="{{ spProductFormPage.item.code }}"></label>
      <label>商品名称<input id="spfName" value="{{ spProductFormPage.item.name }}"></label>
      <label>价格（元）<input id="spfPrice" value="{{ spProductFormPage.item.price }}" inputmode="decimal"></label>
      <label>币种<input id="spfCurrency" value="{{ spProductFormPage.item.currency }}" maxlength="3"></label>
      <label>库存<input id="spfStock" type="number" min="0" value="{{ spProductFormPage.item.stockQuantity }}"></label>
      <div style="font-size:12px;color:#8F959E;align-self:end;padding-bottom:10px">服务端版本：{{ spProductFormPage.item.version }} · 生命周期：{{ spProductFormPage.item.lifecycle }}</div>
      <label style="grid-column:1/-1">描述<textarea id="spfDescription" rows="5">{{ spProductFormPage.item.description }}</textarea></label>
    </div>
  </div>
  <div style="max-width:900px;padding:14px 16px;border:1px solid #F5D6A7;border-radius:8px;background:#FFF9F0;font-size:13px;color:#8F5A16">旧图片、素材、标签和外部推送引用保持清空；会员数据只保留当前白名单关联。</div>
</div>
