version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/platform/store/queries
    gen:
      go:
        package: dbgen
        out: internal/platform/store/generated
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/events/store/queries
    gen:
      go:
        package: eventdb
        out: internal/events/store/generated
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/config/store/queries
    gen:
      go:
        package: configdb
        out: internal/config/store/generated
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
