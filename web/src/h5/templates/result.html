<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none"><span style="font-size:16px;font-weight:600">测评结果</span><span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span></div>
<div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;padding:14px 14px 24px">
  <sc-if value="{{ loading }}"><div role="status" style="background:#fff;border-radius:14px;padding:18px;color:#646A73">正在查询真实提交结果…</div></sc-if>
  <sc-if value="{{ error }}"><div role="alert" data-h5-error style="background:#FDECEE;border-radius:12px;padding:14px;color:#D83931">{{ error }}<sc-if value="{{ canRetry }}"><button onClick="{{ act.retry }}" style="display:block;margin-top:10px">重试查询</button></sc-if></div></sc-if>
  <sc-if value="{{ result }}"><div data-h5-result style="border-radius:16px;padding:22px 20px;background:linear-gradient(150deg,#16233A 0%,#25406E 62%,#2C55A8 100%);color:#fff;margin-bottom:12px"><span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:600">提交已确认</span><h1 style="margin:14px 0 0;font-size:24px;line-height:32px;font-weight:600">问卷提交记录已保存</h1><p style="margin:10px 0 0;font-size:14px;line-height:22px;color:rgba(255,255,255,.78)">当前后端结果契约不提供测评分数、课程推荐或支付状态。</p></div>
  <div style="background:#fff;border-radius:14px;padding:16px"><div style="font-size:16px;font-weight:600;margin-bottom:12px">提交回执</div><div style="display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:13px"><span style="color:#8F959E">提交编号</span><strong>{{ result.submission_id }}</strong><span style="color:#8F959E">定义版本</span><strong>{{ result.definition_version }}</strong><span style="color:#8F959E">提交时间</span><strong>{{ result.submitted_at }}</strong><span style="color:#8F959E">处理范围</span><strong>仅本地处理，未执行外部效果</strong></div></div></sc-if>
</div>
