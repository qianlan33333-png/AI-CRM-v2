components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
  parameters:
    ProductID:
      name: product_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller key; reusing it with a different normalized command is a conflict.
      schema: { type: string, minLength: 16, maxLength: 128 }
    MergeReviewID:
      name: review_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SegmentID:
      name: segment_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StageID:
      name: stage_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor; clients must not parse or synthesize it.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CustomerKeyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    OwnerStaffIDFilter:
      name: owner_staff_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    StageIDFilter:
      name: stage_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    ChannelIDFilter:
      name: channel_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    TagIDFilter:
      name: tag_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    IsDeletedFilter:
      name: is_deleted
      in: query
      required: false
      schema: { type: boolean, default: false }
    AddedAfterFilter:
      name: added_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    AddedBeforeFilter:
      name: added_before
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractAfterFilter:
      name: last_interact_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractBeforeFilter:
      name: last_interact_before
      in: query
      required: false
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Principal lacks the capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Current state conflicts with the command.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnprocessableEntity:
      description: The command violates a field-level validation rule.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    LegacyWriteMetadata:
      type: object
      properties:
        actor: {}
        idempotency_key: { type: string, maxLength: 200 }
        trace_id: { type: string, maxLength: 200 }
        dry_run: { type: boolean, default: false }
    LegacyTagGroupCreateRequest:
      allOf:
        - $ref: "#/components/schemas/LegacyWriteMetadata"
        - { type: object, additionalProperties: false, required: [group_name, first_tag_name], properties: { group_name: { type: string, minLength: 1, maxLength: 200 }, first_tag_name: { type: string, minLength: 1, maxLength: 200 }, actor: {}, idempotency_key: { type: string, maxLength: 200 }, trace_id: { type: string, maxLength: 200 }, dry_run: { type: boolean } } }
    LegacyTagGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/LegacyWriteMetadata"
        - { type: object, additionalProperties: false, required: [group_name], properties: { group_name: { type: string, minLength: 1, maxLength: 200 }, actor: {}, idempotency_key: { type: string, maxLength: 200 }, trace_id: { type: string, maxLength: 200 }, dry_run: { type: boolean } } }
    LegacyTagCreateRequest:
      allOf:
        - $ref: "#/components/schemas/LegacyWriteMetadata"
        - { type: object, additionalProperties: false, required: [group_id, group_name, tag_name], properties: { group_id: { type: integer, format: int64, minimum: 1 }, group_name: { type: string, minLength: 1, maxLength: 200 }, tag_name: { type: string, minLength: 1, maxLength: 200 }, actor: {}, idempotency_key: { type: string, maxLength: 200 }, trace_id: { type: string, maxLength: 200 }, dry_run: { type: boolean } } }
    LegacyTagUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/LegacyWriteMetadata"
