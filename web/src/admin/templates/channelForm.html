<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
  <div><div style="font-size:12px;color:#8F959E">运营 / 渠道码中心</div><div style="font-size:16px;font-weight:600">{{ channelFormPage.title }}</div></div>
  <div style="display:flex;gap:8px"><button onClick="{{ go.channels }}">返回列表</button><sc-if value="{{ channelFormPage.exists }}"><button onClick="{{ channelFormPage.save }}" style="border:0;background:#3370ff;color:#fff">保存渠道</button></sc-if></div>
</div>
<sc-if value="{{ channelFormPage.notFound }}"><div style="margin:24px;padding:18px;border:1px solid #F2B8B5;border-radius:8px;background:#FFF1F0;color:#D83931">渠道不存在或不在当前白名单数据中。</div></sc-if>
<sc-if value="{{ channelFormPage.exists }}">
<div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
  <div style="max-width:900px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">渠道当前定义</div>
    <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
      <label>名称<input id="channelName" value="{{ channelFormPage.item.name }}"></label>
      <label>编码<input id="channelCode" value="{{ channelFormPage.item.code }}"></label>
      <label>类型<select id="channelType"><sc-if value="{{ channelFormPage.item.qrcodeType }}"><option value="qrcode" selected>二维码</option><option value="wecom_customer_acquisition">企微获客</option></sc-if><sc-if value="{{ channelFormPage.item.acquisitionType }}"><option value="qrcode">二维码</option><option value="wecom_customer_acquisition" selected>企微获客</option></sc-if></select></label>
      <label>载体<select id="channelCarrier"><sc-if value="{{ channelFormPage.item.qrcodeCarrier }}"><option value="qrcode" selected>二维码</option><option value="link">链接</option></sc-if><sc-if value="{{ channelFormPage.item.linkCarrier }}"><option value="qrcode">二维码</option><option value="link" selected>链接</option></sc-if></select></label>
      <label>状态<select id="channelStatus"><sc-if value="{{ channelFormPage.item.statusActive }}"><option value="active" selected>启用</option><option value="inactive">未启用</option><option value="archived">归档</option></sc-if><sc-if value="{{ channelFormPage.item.statusInactive }}"><option value="inactive" selected>未启用</option><option value="active">启用</option><option value="archived">归档</option></sc-if><sc-if value="{{ channelFormPage.item.statusArchived }}"><option value="archived" selected>归档</option><option value="inactive">未启用</option><option value="active">启用</option></sc-if></select></label>
      <label>业务场景<input id="channelScene" value="{{ channelFormPage.item.sceneValue }}"></label>
      <label>二维码地址<input id="channelQrUrl" value="{{ channelFormPage.item.qrUrl }}"></label>
      <label>渠道参数<input id="channelCustomerChannel" value="{{ channelFormPage.item.customerChannel }}"></label>
      <label style="grid-column:1/-1">链接地址<input id="channelLinkUrl" value="{{ channelFormPage.item.linkUrl }}"></label>
      <label style="grid-column:1/-1">欢迎语<textarea id="channelWelcome" rows="4">{{ channelFormPage.item.welcomeMessage }}</textarea></label>
    </div>
  </div>
  <div style="max-width:900px;padding:14px 16px;border:1px solid #F5D6A7;border-radius:8px;background:#FFF9F0;font-size:13px;color:#8F5A16">员工、标签、欢迎素材和 Provider 资产均为未配置；本页不会读取旧目录，也不会发起外部执行。</div>
</div>
</sc-if>
