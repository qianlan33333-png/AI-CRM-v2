<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">增长诊断测评</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;padding:14px 14px 24px">
          <div style="background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:12px">
            <span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#EFF4FF;color:var(--accent,#3370ff);font-size:12px;font-weight:600">问卷入口</span>
            <h1 style="margin:12px 0 0;font-size:22px;line-height:30px;font-weight:600">3 分钟看清你的增长卡点</h1>
            <p style="margin:8px 0 0;font-size:14px;line-height:22px;color:#8F959E">共 12 题，约 3 分钟。提交后即可查看你的诊断报告。</p>
          </div>

          <div style="background:#fff;border-radius:14px;padding:16px 16px 18px;margin-bottom:12px">
            <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:12px">1. 你目前最想解决的问题是？<span style="color:#F54A45;margin-left:2px">*</span></div>
            <sc-for list="{{ opts.single }}" as="o" hint-placeholder-count="4">
              <label onClick="{{ o.pick }}" style="{{ o.style }}"><span style="{{ o.dot }}"></span><span style="font-size:15px;line-height:22px">{{ o.text }}</span></label>
            </sc-for>
          </div>

          <div style="background:#fff;border-radius:14px;padding:16px 16px 18px;margin-bottom:12px">
            <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:4px">2. 目前在做哪些渠道？<span style="color:#F54A45;margin-left:2px">*</span></div>
            <div style="font-size:13px;color:#A6AAB0;margin-bottom:12px">可多选</div>
            <sc-for list="{{ opts.multi }}" as="o" hint-placeholder-count="5">
              <label onClick="{{ o.pick }}" style="{{ o.style }}"><span style="{{ o.box }}"></span><span style="font-size:15px;line-height:22px">{{ o.text }}</span></label>
            </sc-for>
            <input placeholder="请填写其它内容" style="width:100%;height:42px;margin-top:2px;border:1px solid #DEE0E3;border-radius:10px;padding:0 12px;font-size:14px;background:#fff">
          </div>

          <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px">
            <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:12px">3. 你希望我们重点帮你解决什么？</div>
            <textarea rows="4" placeholder="选填，越具体我们的建议越准确" style="width:100%;border:1px solid #DEE0E3;border-radius:10px;padding:12px;font-size:14px;line-height:22px;background:#fff;resize:none"></textarea>
          </div>

          <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:16px">
            <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:12px">4. 手机号<span style="color:#F54A45;margin-left:2px">*</span></div>
            <input value="138 0000 4021" style="width:100%;height:46px;border:1px solid #DEE0E3;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;font-variant-numeric:tabular-nums">
            <div style="font-size:12px;color:#A6AAB0;margin-top:8px">仅用于给你发送诊断报告，不会对外提供。</div>
          </div>

          <button onClick="{{ act.submitAll }}" style="width:100%;height:48px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">提交</button>
