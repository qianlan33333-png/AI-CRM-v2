        - { name: run_id, in: query, schema: { type: string, maxLength: 80 } }
        - { name: agent_code, in: query, schema: { type: string, maxLength: 80 } }
        - { name: run_status, in: query, schema: { type: string, maxLength: 40 } }
        - { name: trigger_source, in: query, schema: { type: string, maxLength: 80 } }
        - { name: unionid, in: query, schema: { type: string, maxLength: 200 } }
        - { name: userid, in: query, schema: { type: string, maxLength: 200 } }
        - { name: started_after, in: query, schema: { type: string, format: date-time } }
        - { name: started_before, in: query, schema: { type: string, format: date-time } }
        - { name: has_error, in: query, schema: { type: boolean } }
        - { name: visibility, in: query, schema: { type: string, enum: [masked], default: masked } }
      responses:
        "200":
          description: Real, masked Automation trigger receipts; no historical execution trace projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationTriggerRunListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
  parameters:
    ProductID:
      name: product_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller key; reusing it with a different normalized command is a conflict.
      schema: { type: string, minLength: 16, maxLength: 128 }
    MergeReviewID:
      name: review_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SegmentID:
      name: segment_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StageID:
      name: stage_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor; clients must not parse or synthesize it.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CustomerKeyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    OwnerStaffIDFilter:
      name: owner_staff_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    StageIDFilter:
      name: stage_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    ChannelIDFilter:
      name: channel_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    TagIDFilter:
      name: tag_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    IsDeletedFilter:
      name: is_deleted
      in: query
      required: false
      schema: { type: boolean, default: false }
    AddedAfterFilter:
      name: added_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    AddedBeforeFilter:
      name: added_before
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractAfterFilter:
      name: last_interact_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractBeforeFilter:
      name: last_interact_before
      in: query
      required: false
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Principal lacks the capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Current state conflicts with the command.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnprocessableEntity:
      description: The command violates a field-level validation rule.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    Product:
      type: object
      required: [id, product_code, name, description, price_minor, currency, stock_quantity, images, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        product_code: {type: string, minLength: 1, maxLength: 200}
        name: {type: string}
        description: {type: string}
        price_minor: {type: integer, format: int64}
        currency: {type: string}
        stock_quantity: {type: integer, format: int32}
        images: {type: array, items: {type: string}}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProductPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Product"}}
        next_cursor: {type: string}
    CreateProductRequest:
      type: object
      required: [product_code, name, description, price_minor, currency, stock_quantity, images]
      properties:
        product_code: {type: string, minLength: 1, maxLength: 200}
        name: {type: string}
        description: {type: string}
        price_minor: {type: integer, format: int64, minimum: 0}
        currency: {type: string}
        stock_quantity: {type: integer, format: int32, minimum: 0}
        images: {type: array, items: {type: string}}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, is_deleted, extra, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, minimum: -32768, maximum: 32767, nullable: true }
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        added_at: { type: string, format: date-time, nullable: true }
        last_interact_at: { type: string, format: date-time, nullable: true }
        is_deleted: { type: boolean }
        extra: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, minimum: -32768, maximum: 32767, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        extra: { type: object, additionalProperties: true }
    SetCustomerStageRequest:
      type: object
      additionalProperties: false
      required: [stage_id]
      properties:
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
    CustomerListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total, total_is_estimate, watermark]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
        total: { type: integer, format: int64, minimum: 0 }
        total_is_estimate: { type: boolean }
        watermark: { type: string, format: date-time }
    CustomerDetailResponse:
      type: object
      additionalProperties: false
      required: [customer, tags]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    CustomerEvent:
      type: object
      additionalProperties: false
      required: [id, customer_id, event_type, payload, actor, occurred_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        customer_id: { type: integer, format: int64, minimum: 1 }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        actor: { type: string, minLength: 1, maxLength: 200 }
        occurred_at: { type: string, format: date-time }
    CustomerEventListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CustomerEvent" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, sort_order]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        group_id: { type: integer, format: int64, minimum: 1, nullable: true }
        group_name: { type: string, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer, format: int32 }
    TagListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    SegmentDefinition:
      oneOf:
        - $ref: "#/components/schemas/SegmentDefinitionAnd"
        - $ref: "#/components/schemas/SegmentDefinitionOr"
        - $ref: "#/components/schemas/SegmentDefinitionPredicate"
    SegmentDefinitionAnd:
      type: object
      additionalProperties: false
      required: [and]
      properties:
        and:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/SegmentDefinition" }
    SegmentDefinitionOr:
      type: object
      additionalProperties: false
      required: [or]
      properties:
        or:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/SegmentDefinition" }
    SegmentDefinitionPredicate:
      type: object
      additionalProperties: false
      required: [field, op, value]
      properties:
        field:
          type: string
          enum: [stage_id, owner_staff_id, channel_id, tag_id, added_at, last_interact_at, is_deleted]
        op:
          type: string
          enum: [eq, in, has_any, before, after]
        value: {}
    Segment:
      type: object
      additionalProperties: false
      required: [id, name, definition, refresh_mode, refresh_cron, member_count, refreshed_at, refresh_status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        refresh_mode: { type: string, enum: [manual, scheduled] }
        refresh_cron: { type: string, minLength: 1, maxLength: 200, nullable: true }
        member_count: { type: integer, format: int64, minimum: 0 }
        refreshed_at: { type: string, format: date-time, nullable: true }
        refresh_status: { type: string, enum: [idle, running, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SegmentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        next_cursor: { type: string, minLength: 1, maxLength: 512, nullable: true }
    SegmentMemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        next_cursor: { type: string, minLength: 1, maxLength: 512, nullable: true }
    CreateSegmentRequest:
      type: object
      additionalProperties: false
      required: [name, definition, refresh_mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        refresh_mode: { type: string, enum: [manual, scheduled] }
        refresh_cron: { type: string, minLength: 1, maxLength: 200, nullable: true }
    UpdateSegmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        refresh_mode: { type: string, enum: [manual, scheduled] }
        refresh_cron: { type: string, minLength: 1, maxLength: 200, nullable: true }
    SegmentRefreshAccepted:
      type: object
      additionalProperties: false
      required: [status, segment_id]
      properties:
        status: { type: string, enum: [accepted] }
        segment_id: { type: integer, format: int64, minimum: 1 }
    Stage:
      type: object
      additionalProperties: false
      required: [id, name, sort_order, config]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1 }
        sort_order: { type: integer, format: int32 }
        config: {}
    StageListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Stage" } }
    CreateStageRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        sort_order: { type: integer, format: int32, default: 0 }
        config: {}
    RenameStageRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    IdentityRef:
      type: object
      additionalProperties: false
      description: Admin HTTP supplies declared evidence only; verified evidence is internal-adapter-only.
      required: [type, scope, value]
      properties:
        type:
          type: string
          enum: [wecom_external_userid, unionid, mp_openid, oa_openid, alipay_user_id, phone, ext]
        scope: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
    ResolveIdentityRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties: { ref: { $ref: "#/components/schemas/IdentityRef" } }
    ResolveIdentityResponse:
      oneOf:
        - $ref: "#/components/schemas/ResolveIdentityFound"
        - $ref: "#/components/schemas/ResolveIdentityNotFound"
        - $ref: "#/components/schemas/ResolveIdentityConflict"
      discriminator:
        propertyName: status
        mapping:
          found: "#/components/schemas/ResolveIdentityFound"
          not_found: "#/components/schemas/ResolveIdentityNotFound"
          conflict: "#/components/schemas/ResolveIdentityConflict"
    ResolveIdentityFound:
      type: object
      additionalProperties: false
      required: [status, customer_id]
      properties:
        status: { type: string, enum: [found] }
        customer_id: { type: integer, format: int64, minimum: 1 }
    ResolveIdentityNotFound:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { type: string, enum: [not_found] } }
    ResolveIdentityConflict:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { type: string, enum: [conflict] } }
    BindIdentityRequest:
      type: object
      additionalProperties: false
      required: [customer_id, ref]
      properties:
        customer_id: { type: integer, format: int64, minimum: 1 }
        ref: { $ref: "#/components/schemas/IdentityRef" }
    BindIdentityResponse:
      oneOf:
        - $ref: "#/components/schemas/BindIdentityBound"
        - $ref: "#/components/schemas/BindIdentityAlreadyBound"
        - $ref: "#/components/schemas/BindIdentityMerged"
        - $ref: "#/components/schemas/BindIdentityManualReview"
        - $ref: "#/components/schemas/BindIdentityRejected"
      discriminator:
        propertyName: status
        mapping:
          bound: "#/components/schemas/BindIdentityBound"
          already_bound: "#/components/schemas/BindIdentityAlreadyBound"
          merged: "#/components/schemas/BindIdentityMerged"
          manual_review: "#/components/schemas/BindIdentityManualReview"
          rejected: "#/components/schemas/BindIdentityRejected"
    BindIdentityBound:
      type: object
      additionalProperties: false
      required: [status, customer_id]
      properties:
        status: { type: string, enum: [bound] }
        customer_id: { type: integer, format: int64, minimum: 1 }
    BindIdentityAlreadyBound:
      type: object
      additionalProperties: false
      required: [status, customer_id]
      properties:
        status: { type: string, enum: [already_bound] }
        customer_id: { type: integer, format: int64, minimum: 1 }
    BindIdentityMerged:
      type: object
      additionalProperties: false
      required: [status, customer_id, primary_customer_id, merge_audit_id]
      properties:
        status: { type: string, enum: [merged] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        primary_customer_id: { type: integer, format: int64, minimum: 1 }
        merge_audit_id: { type: integer, format: int64, minimum: 1 }
    BindIdentityManualReview:
      type: object
      additionalProperties: false
      required: [status, review_id]
      properties:
        status: { type: string, enum: [manual_review] }
        review_id: { type: integer, format: int64, minimum: 1 }
    BindIdentityRejected:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { type: string, enum: [rejected] } }
    IngestIdentityEventRequest:
      type: object
      additionalProperties: false
      required: [refs, event_type, payload, occurred_at]
      properties:
        refs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/IdentityRef" } }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    IngestIdentityEventResponse:
      oneOf:
        - $ref: "#/components/schemas/IngestIdentityEventAttributed"
        - $ref: "#/components/schemas/IngestIdentityEventPending"
        - $ref: "#/components/schemas/IngestIdentityEventConflict"
      discriminator:
        propertyName: status
        mapping:
          attributed: "#/components/schemas/IngestIdentityEventAttributed"
          pending: "#/components/schemas/IngestIdentityEventPending"
          conflict: "#/components/schemas/IngestIdentityEventConflict"
    IngestIdentityEventAttributed:
      type: object
      additionalProperties: false
      required: [status, customer_id, event_id]
      properties:
        status: { type: string, enum: [attributed] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        event_id: { type: integer, format: int64, minimum: 1 }
    IngestIdentityEventPending:
      type: object
      additionalProperties: false
      required: [status, pending_event_id]
      properties:
        status: { type: string, enum: [pending] }
        pending_event_id: { type: integer, format: int64, minimum: 1 }
    IngestIdentityEventConflict:
      type: object
      additionalProperties: false
      required: [status, pending_event_id]
      properties:
        status: { type: string, enum: [conflict] }
        pending_event_id: { type: integer, format: int64, minimum: 1 }
    IdentityMergeReview:
      type: object
      additionalProperties: false
      required: [review_id, status, type, scope, identity_fingerprint, customer_ids, version, created_at, resolved_at]
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [pending, approved, rejected] }
        type: { type: string, enum: [unionid, phone] }
        scope: { type: string, minLength: 1 }
        identity_fingerprint:
          type: string
          description: Versioned secret-backed HMAC; never a raw identity or unkeyed digest.
          pattern: '^hmac-sha256-v[1-9][0-9]*:[A-Za-z0-9_-]{21}[AQgw]$'
        customer_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Explicitly null while pending; non-null after approval or rejection.
    IdentityMergeReviewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IdentityMergeReview" } }
        next_cursor: { type: string, minLength: 1, maxLength: 512, nullable: true }
    ApproveIdentityMergeReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_version, primary_customer_id, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        primary_customer_id: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RejectIdentityMergeReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [admin_user_id, role]
      properties:
        admin_user_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [admin, ops, sales] }
        staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
    AdminConfigEntry:
      type: object
      additionalProperties: false
      required: [key, configured, source_status]
      properties:
        key: { type: string, minLength: 1 }
        configured: { type: boolean }
        source_status: { type: string, enum: [configured, missing, invalid] }
    AdminConfigOverviewResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminConfigEntry" } }
    AutomationTriggerRun:
      type: object
      additionalProperties: false
      required: [run_id, request_id, agent_code, run_status, trigger_source, customer_id, tag_id, source_event_id, triggered_event_id, started_at, completed_at, has_error]
      properties:
        run_id: { type: string, pattern: '^automation-trigger:[1-9][0-9]*$' }
        request_id: { type: string, pattern: '^event:[1-9][0-9]*$' }
        agent_code: { type: string, enum: [tag-trigger-v1] }
        run_status: { type: string, enum: [completed] }
        trigger_source: { type: string, enum: [customer.tag_applied] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        tag_id: { type: integer, format: int64, minimum: 1 }
        source_event_id: { type: integer, format: int64, minimum: 1 }
        triggered_event_id: { type: integer, format: int64, minimum: 1 }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        has_error: { type: boolean, enum: [false] }
    AutomationTriggerRunListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, visibility]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AutomationTriggerRun" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, format: int32, minimum: 1 }
        page_size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        visibility: { type: string, enum: [masked] }
