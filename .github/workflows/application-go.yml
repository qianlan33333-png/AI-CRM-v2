name: application / go

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: application / go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASH_ENV: ""
      ENV: ""
      GOTOOLCHAIN: local
      GOWORK: "off"
    services:
      postgres:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Verify Go gates
        env:
          P0S03_PG_INTEGRATION: "1"
          P0S03_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          QUERY_PLAN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          QUERY_PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          QUERY_PLAN_HEAD_SHA: ${{ github.sha }}
        run: make ci-go
      - name: Verify PostgreSQL version and migrations
        env:
          ALLOW_DESTRUCTIVE_RIVER_MIGRATION_TEST: "1"
          ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          test "$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d aicrm_test -Atqc 'SHOW server_version_num')" = "160014"
          make migration-integration
          P3C01A_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c01a-migration-acceptance
          P3R4B_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-r4b-identity-storage-acceptance
          P3C07C_R3B_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c07c-r3b-storage-acceptance
          P3C07C_R3C_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c07c-r3c-behavior-acceptance
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c02a-acceptance
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c02b-acceptance
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c02d-acceptance
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c02e-acceptance
          P3C03_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c03-migration-acceptance
          P3C07A_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c07a-acceptance
          P3C07B2_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-c07b2-acceptance
          SEGMENT_CRUD_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-s05b-acceptance
          WECOM_SYNC_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-w4-acceptance
          make p0-s04-integration
          P3O2_ENQUEUE_ONE_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o2-enqueue-one-acceptance
          P3O3_ENQUEUE_BATCH_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o3-enqueue-batch-acceptance
          P3O4_SENDER_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o4-sender-acceptance
          P3O5_STATUS_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o5-status-acceptance
          P3O6A_RETRY_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o6a-retry-acceptance
          P3O6B1_CANCEL_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o6b1-cancel-acceptance
          P3O6B2_MANUAL_RETRY_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o6b2-manual-retry-acceptance
          P3O7_LEGACY_API_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p3-o7-legacy-api-acceptance
          P4W0D01_AUTOMATION_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p4-w0-d01-automation-acceptance
          P4W0L01_STATS_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p4-w0-l01-stats-acceptance
          P4A01_AUTH_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p4-a01-auth-acceptance
          P4SI00B_AUTH_TEST_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" make p4-si00b-auth-acceptance
  web:
    name: application / web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
          token: ''
      - name: Install pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - name: Verify web gates
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.12.1"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
