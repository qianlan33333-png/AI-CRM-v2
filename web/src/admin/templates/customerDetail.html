
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
              <a onClick="{{ go.customers }}" style="width:28px;height:28px;border:1px solid #DEE0E3;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#646A73" stroke-width="1.6"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg></a>
              <div style="min-width:0">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8F959E;line-height:14px"><a onClick="{{ go.customers }}" style="cursor:pointer;color:#8F959E">客户列表</a><span>/</span><span>客户档案</span></div>
                <div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;font-weight:600;line-height:22px">李思远</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;background:#EBF9EC;color:#2EA121;font-size:12px">已激活</span></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex:none">
              <button onClick="{{ go.customers }}" style="height:30px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;font-size:13px;cursor:pointer">返回客户列表</button>
            </div>
          </div>
          <div style="flex:1;min-height:0;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start">
            <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px">
              <div><div style="font-size:12px;color:#8F959E;margin-bottom:4px">姓名</div><div style="font-size:14px;font-weight:500">李思远</div></div>
              <div><div style="font-size:12px;color:#8F959E;margin-bottom:4px">手机号</div><div style="font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">138****4021</div></div>
              <div><div style="font-size:12px;color:#8F959E;margin-bottom:4px">负责人</div><div style="font-size:14px">张敏</div></div>
              <div><div style="font-size:12px;color:#8F959E;margin-bottom:4px">外部联系人 ID</div><div style="font-size:13px;color:#646A73;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis">wmA8c3DQAA_x91</div></div>
              <div><div style="font-size:12px;color:#8F959E;margin-bottom:4px">unionid</div><div style="font-size:13px;color:#646A73;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis">oX7Yq5-2fNq0Bd</div></div>
            </div>

            <div style="display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start">
              <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start">
                <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #EFF0F1"><h2 style="margin:0;font-size:14px;font-weight:600">实时标签</h2><span style="font-size:12px;color:#8F959E">企微实时读取，不写入数据库</span></div>
                  <div style="padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px">
                    <sc-for list="{{ rows.tags }}" as="t" hint-placeholder-count="6">
                      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:4px;background:#F2F3F5;color:#646A73;font-size:12px">{{ t.name }}</span>
                    </sc-for>
                  </div>
                </div>
                <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #EFF0F1"><h2 style="margin:0;font-size:14px;font-weight:600">已填写问卷及答案</h2></div>
                  <table style="width:100%;border-collapse:collapse">
                    <thead><tr><th style="padding:9px 16px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:42%">问题</th><th style="padding:9px 16px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap">答案</th></tr></thead>
                    <tbody>
                      <sc-for list="{{ rows.qa }}" as="q" hint-placeholder-count="4">
                        <tr><td style="padding:var(--rp,10px) 16px;border-bottom:1px solid #F2F3F5;font-size:13px;color:#646A73">{{ q.q }}</td><td style="padding:var(--rp,10px) 16px;border-bottom:1px solid #F2F3F5;font-size:13px">{{ q.a }}</td></tr>
                      </sc-for>
                    </tbody>
                  </table>
                </div>
              </div>

              <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;display:flex;flex-direction:column">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #EFF0F1">
                  <div><h2 style="margin:0;font-size:14px;font-weight:600">聊天记录</h2><p style="margin:2px 0 0;font-size:12px;color:#8F959E">默认最近 30 条，按时间从旧到新</p></div>
                  <button style="height:28px;padding:0 10px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;font-size:12px;cursor:pointer">获取全部</button>
                </div>
                <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
                  <sc-for list="{{ rows.msgs }}" as="m" hint-placeholder-count="4">
                    <div style="{{ m.wrap }}">
                      <div style="font-size:11px;color:#A6AAB0;margin-bottom:4px">{{ m.who }} · {{ m.time }}</div>
                      <div style="{{ m.bubble }}">{{ m.text }}</div>
                    </div>
                  </sc-for>
                </div>
              </div>
            </div>
          </div>
