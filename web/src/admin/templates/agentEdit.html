<div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3"><div><div style="font-size:12px;color:#8F959E">HXC 发送人配置 / 编辑</div><div style="font-size:16px;font-weight:600">本地发送人</div></div><button onClick="{{ hxcPage.back }}">返回列表</button></div>
<div style="padding:20px;overflow:auto"><div style="max-width:720px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;padding:18px;display:grid;gap:14px">
  <div style="padding:10px 12px;background:#FFF7E8;border:1px solid #FFE0B2;border-radius:6px;color:#8A4B08;font-size:13px">保存只写 CRM 本地配置，响应中的 provider_call_executed/real_external_call_executed 必须为 false。</div>
  <label><span style="display:block;font-size:12px;color:#646A73;margin-bottom:6px">配置 ID *</span><input id="hxcId" value="{{ hxcPage.item.senderId }}" placeholder="hxc-sender-01" style="height:34px;width:100%;box-sizing:border-box"></label>
  <label><span style="display:block;font-size:12px;color:#646A73;margin-bottom:6px">sender_userid *</span><input id="hxcUserid" value="{{ hxcPage.item.code }}" placeholder="zhangsan" style="height:34px;width:100%;box-sizing:border-box;font-family:ui-monospace"></label>
  <label><span style="display:block;font-size:12px;color:#646A73;margin-bottom:6px">显示名</span><input id="hxcName" value="{{ hxcPage.item.name }}" style="height:34px;width:100%;box-sizing:border-box"></label>
  <label><span style="display:block;font-size:12px;color:#646A73;margin-bottom:6px">优先级（0-100000）</span><input id="hxcPriority" type="number" min="0" max="100000" value="{{ hxcPage.item.priority }}" style="height:34px;width:100%;box-sizing:border-box"></label>
  <label style="display:flex;gap:8px;align-items:center"><sc-if value="{{ hxcPage.item.isActive }}"><input id="hxcActive" type="checkbox" checked="checked"></sc-if><sc-if value="{{ hxcPage.item.activeOff }}"><input id="hxcActive" type="checkbox"></sc-if>启用本地配置</label>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button onClick="{{ hxcPage.back }}">取消</button><button onClick="{{ hxcPage.save }}" style="background:#3370ff;color:#fff;border:0;padding:8px 16px;border-radius:6px">保存本地配置</button></div>
</div></div>
