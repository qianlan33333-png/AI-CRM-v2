    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller key; reusing it with a different normalized command is a conflict.
      schema: { type: string, minLength: 16, maxLength: 128 }
    MergeReviewID:
      name: review_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SegmentID:
