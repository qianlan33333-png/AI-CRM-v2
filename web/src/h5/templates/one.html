<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">增长诊断测评</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;background:#F5F6F7">
          <div style="flex:1;min-height:0;overflow:auto;padding:16px 14px">
            <div style="background:#fff;border-radius:14px;padding:16px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
                <span style="font-size:13px;color:#8F959E;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">增长诊断测评</span>
                <span style="font-size:13px;font-weight:600;color:var(--accent,#3370ff);white-space:nowrap">{{ qProgressText }}</span>
              </div>
              <div style="height:6px;border-radius:999px;background:#EBEDF0;overflow:hidden"><div style="width:{{ qPct }}%;height:100%;border-radius:999px;background:var(--accent,#3370ff)"></div></div>
              <div style="margin-top:20px;font-size:13px;font-weight:600;color:var(--accent,#3370ff)">{{ qTitle }}</div>
              <div style="margin-top:8px;font-size:19px;line-height:28px;font-weight:600">你的私域客户主要来自哪个渠道？<span style="color:#F54A45;margin-left:2px">*</span></div>
              <div style="margin-top:16px">
                <sc-for list="{{ opts.step }}" as="o" hint-placeholder-count="4">
                  <label onClick="{{ o.pick }}" style="{{ o.style }}"><span style="{{ o.dot }}"></span><span style="font-size:15px;line-height:22px">{{ o.text }}</span></label>
                </sc-for>
              </div>
              <p style="margin:14px 0 0;font-size:13px;line-height:20px;color:#A6AAB0;text-align:center">普通选项会自动进入下一题；选择「其它」后请先填写内容。</p>
            </div>
          </div>
          <div style="flex:none;display:grid;grid-template-columns:0.8fr 1.2fr;gap:10px;padding:14px 14px 22px;background:#fff;border-top:1px solid #EDEEF0">
            <button onClick="{{ act.prevQ }}" style="height:48px;border:1px solid #DEE0E3;border-radius:12px;background:#fff;font-size:16px;font-weight:600;color:#1F2329;cursor:pointer">上一题</button>
            <button onClick="{{ act.nextQ }}" style="height:48px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">下一题</button>
          </div>
