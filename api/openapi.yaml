      required: [refs, event_type, payload, occurred_at]
      properties:
        refs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/IdentityRef" } }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    IngestIdentityEventResponse:
      oneOf:
        - $ref: "#/components/schemas/IngestIdentityEventAttributed"
        - $ref: "#/components/schemas/IngestIdentityEventPending"
        - $ref: "#/components/schemas/IngestIdentityEventConflict"
      discriminator:
        propertyName: status
        mapping:
          attributed: "#/components/schemas/IngestIdentityEventAttributed"
          pending: "#/components/schemas/IngestIdentityEventPending"
          conflict: "#/components/schemas/IngestIdentityEventConflict"
    IngestIdentityEventAttributed:
      type: object
      additionalProperties: false
      required: [status, customer_id, event_id]
      properties:
        status: { type: string, enum: [attributed] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        event_id: { type: integer, format: int64, minimum: 1 }
    IngestIdentityEventPending:
      type: object
      additionalProperties: false
      required: [status, pending_event_id]
      properties:
        status: { type: string, enum: [pending] }
        pending_event_id: { type: integer, format: int64, minimum: 1 }
    IngestIdentityEventConflict:
      type: object
      additionalProperties: false
      required: [status, pending_event_id]
      properties:
        status: { type: string, enum: [conflict] }
        pending_event_id: { type: integer, format: int64, minimum: 1 }
    IdentityMergeReview:
      type: object
      additionalProperties: false
      required: [review_id, status, type, scope, identity_fingerprint, customer_ids, version, created_at, resolved_at]
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [pending, approved, rejected] }
        type: { type: string, enum: [unionid, phone] }
        scope: { type: string, minLength: 1 }
        identity_fingerprint:
          type: string
          description: Versioned secret-backed HMAC; never a raw identity or unkeyed digest.
          pattern: '^hmac-sha256-v[1-9][0-9]*:[A-Za-z0-9_-]{21}[AQgw]$'
        customer_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Explicitly null while pending; non-null after approval or rejection.
    IdentityMergeReviewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IdentityMergeReview" } }
        next_cursor: { type: string, minLength: 1, maxLength: 512, nullable: true }
    ApproveIdentityMergeReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_version, primary_customer_id, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        primary_customer_id: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RejectIdentityMergeReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [admin_user_id, role]
      properties:
        admin_user_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [admin, ops, sales] }
        staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
    AdminConfigEntry:
      type: object
      additionalProperties: false
      required: [key, configured, source_status]
      properties:
        key: { type: string, minLength: 1 }
        configured: { type: boolean }
        source_status: { type: string, enum: [configured, missing, invalid] }
    AdminConfigOverviewResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminConfigEntry" } }
    AutomationTriggerRun:
      type: object
      additionalProperties: false
      required: [run_id, request_id, agent_code, run_status, trigger_source, customer_id, tag_id, source_event_id, triggered_event_id, started_at, completed_at, has_error]
      properties:
        run_id: { type: string, pattern: '^automation-trigger:[1-9][0-9]*$' }
        request_id: { type: string, pattern: '^event:[1-9][0-9]*$' }
        agent_code: { type: string, enum: [tag-trigger-v1] }
        run_status: { type: string, enum: [completed] }
        trigger_source: { type: string, enum: [customer.tag_applied] }
        customer_id: { type: integer, format: int64, minimum: 1 }
        tag_id: { type: integer, format: int64, minimum: 1 }
        source_event_id: { type: integer, format: int64, minimum: 1 }
        triggered_event_id: { type: integer, format: int64, minimum: 1 }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        has_error: { type: boolean, enum: [false] }
    AutomationTriggerRunListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, visibility]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AutomationTriggerRun" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, format: int32, minimum: 1 }
        page_size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        visibility: { type: string, enum: [masked] }
