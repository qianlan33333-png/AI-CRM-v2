name: application / go

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: application-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: application / go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASH_ENV: ""
      ENV: ""
      GOTOOLCHAIN: local
      GOWORK: "off"
    services:
      postgres:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact-main verification mode
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci_promotion_decision.sh
      - name: Set up Go
        if: steps.promotion.outputs.mode == 'full'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Verify Go gates
        if: steps.promotion.outputs.mode == 'full'
        env:
          P0S03_PG_INTEGRATION: "1"
          P0S03_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          ACCEPTANCE_FIXTURES_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          QUERY_PLAN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          QUERY_PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          QUERY_PLAN_HEAD_SHA: ${{ github.sha }}
        run: make ci-go
      - name: Verify PostgreSQL version and migrations
        if: steps.promotion.outputs.mode == 'full'
        env:
          ALLOW_DESTRUCTIVE_RIVER_MIGRATION_TEST: "1"
          ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test?sslmode=disable
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          test "$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d aicrm_test -Atqc 'SHOW server_version_num')" = "160014"
          make migration-integration
          CI_ACCEPTANCE_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" scripts/run_ci_acceptance_manifest.sh
      - name: Verify promotion fingerprints
        if: steps.promotion.outputs.mode == 'promotion'
        env:
          CI_PROMOTION_AFFECTED_MANIFEST: ${{ steps.promotion.outputs.affected_manifest }}
        run: scripts/check_ci_promotion_smoke.sh
  web:
    name: application / web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact-main verification mode
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci_promotion_decision.sh
      - name: Set up Node.js
        if: steps.promotion.outputs.mode == 'full'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
          token: ''
      - name: Install pinned npm
        if: steps.promotion.outputs.mode == 'full'
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - name: Verify web gates
        if: steps.promotion.outputs.mode == 'full'
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.12.1"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
      - name: Verify promotion fingerprints
        if: steps.promotion.outputs.mode == 'promotion'
        env:
          CI_PROMOTION_AFFECTED_MANIFEST: ${{ steps.promotion.outputs.affected_manifest }}
        run: scripts/check_ci_promotion_smoke.sh
