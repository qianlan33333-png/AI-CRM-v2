    LegacyTagCatalogResponse:
      type: object
      additionalProperties: true
      required: [ok, items, tags, groups, count, total_tags, tag_limit, synced_at, source_status, read_model_status, route_owner, fallback_used, real_external_call_executed, sync_executed, fixture_used]
