    PushCenterSourceModuleFilter: { name: source_module, in: query, required: false, schema: { type: string, default: "" } }
    PushCenterSourceRouteFilter: { name: source_route, in: query, required: false, schema: { type: string, default: "" } }
    PushCenterCreatedFromFilter: { name: created_from, in: query, required: false, schema: { type: string, default: "" } }
    PushCenterCreatedToFilter: { name: created_to, in: query, required: false, schema: { type: string, default: "" } }
  responses:
    BadRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Principal lacks the capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Current state conflicts with the command.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnprocessableEntity:
      description: The command violates a field-level validation rule.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PublicSurveyInvalidInput:
      description: Public survey input is malformed, unsupported, or unsafe.
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyNotFound:
      description: The public survey definition or result does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyConflict:
      description: The anonymous submission or management idempotency command conflicts with stored local state.
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyRateLimited:
      description: The local anonymous browser/source rate budget is exhausted.
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyUnavailable:
      description: The local Survey dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyGetOnly:
      description: This public survey route accepts only GET.
      headers: { Allow: { required: true, schema: { type: string, enum: [GET] } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
    PublicSurveyPostOnly:
      description: This public survey route accepts only POST.
      headers: { Allow: { required: true, schema: { type: string, enum: [POST] } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicSurveyError" } } }
  schemas:
    PublicSurveyError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [invalid_public_input, not_found, idempotency_conflict, rate_limited, unavailable, method_not_allowed] }
    PublicSurveyDefinition:
      type: object
      additionalProperties: false
      required: [id, slug, title, description, answer_display_mode, version, questions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        slug: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9][a-z0-9-]{0,119}$' }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 10000 }
        answer_display_mode: { type: string, enum: [all_in_one, one_by_one] }
        version: { type: integer, format: int64, minimum: 1 }
        questions: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PublicSurveyQuestion" } }
    PublicSurveyQuestion:
      type: object
      additionalProperties: false
      required: [id, type, title, required, sort_order, minimum_selections, maximum_selections, options]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [single_choice, multi_choice] }
        title: { type: string, minLength: 1, maxLength: 500 }
        required: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 99 }
        minimum_selections: { type: integer, minimum: 0, maximum: 100 }
        maximum_selections: { type: integer, minimum: 1, maximum: 100 }
        options: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PublicSurveyOption" } }
    PublicSurveyOption:
      type: object
      additionalProperties: false
      required: [id, option_text, sort_order]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        option_text: { type: string, minLength: 1, maxLength: 500 }
        sort_order: { type: integer, minimum: 0, maximum: 99 }
    PublicSurveySubmissionRequest:
      type: object
      additionalProperties: false
      required: [version, submission_key, answers]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        submission_key: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        answers: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/PublicSurveySubmissionAnswer" } }
    PublicSurveySubmissionAnswer:
      type: object
      additionalProperties: false
      required: [question_id, option_ids]
      properties:
        question_id: { type: integer, format: int64, minimum: 1 }
        option_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    PublicSurveySubmissionReceipt:
      type: object
      additionalProperties: false
      required: [questionnaire_id, questionnaire_slug, definition_version, submission_id]
      properties:
        questionnaire_id: { type: integer, format: int64, minimum: 1 }
