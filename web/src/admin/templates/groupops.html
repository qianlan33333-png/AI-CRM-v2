          <div style="flex:1;overflow:auto;padding:20px"><div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px 14px">计划</th><th style="text-align:left">状态</th><th style="text-align:left">本地队列</th><th style="text-align:left">revision</th><th style="text-align:left">更新时间</th><th style="text-align:right;padding-right:14px">操作</th></tr></thead><tbody><sc-for list="{{ groupOpsPage.rows }}" as="p" hint-placeholder-count="3"><tr><td style="padding:12px 14px;border-top:1px solid #EFF0F1"><a onClick="{{ p.edit }}" style="color:#245BDB;cursor:pointer">{{ p.name }}</a><div style="font-size:11px;color:#8F959E;font-family:ui-monospace,Menlo,monospace">plan_id={{ p.id }}</div></td><td style="border-top:1px solid #EFF0F1"><span style="{{ p.cs }}">{{ p.status }}</span></td><td style="border-top:1px solid #EFF0F1">{{ p.queueCount }}</td><td style="border-top:1px solid #EFF0F1">{{ p.revision }}</td><td style="border-top:1px solid #EFF0F1">{{ p.updatedAt }}</td><td style="border-top:1px solid #EFF0F1;text-align:right;padding-right:14px"><button onClick="{{ p.edit }}">编辑</button><button onClick="{{ p.toggle }}">{{ p.toggleText }}</button><button onClick="{{ p.archive }}">归档</button><button onClick="{{ p.del }}">删除草稿</button></td></tr></sc-for></tbody></table><sc-if value="{{ groupOpsPage.total }}"></sc-if></div><div style="margin-top:12px;padding:14px;border:1px solid #F5D6A7;background:#FFF9F0;border-radius:8px;color:#8F5A16">本地队列计数不等于已发送。运营成员候选 DTO 仅提供 sender_userid，而计划成员要求数值 staff_id，当前不能安全映射，保持 backend_blocked。启用/暂停/归档只变更本地计划生命周期；本页不接受 run-due、broadcast 或 webhook，不会执行真实群发。</div></div>
