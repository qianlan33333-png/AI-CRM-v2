<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
  <div><div style="font-size:12px;color:#8F959E">交易 / 普通商品</div><div style="font-size:16px;font-weight:600">{{ productFormPage.title }}</div></div>
  <div style="display:flex;gap:8px"><button onClick="{{ go.products }}">返回列表</button><button onClick="{{ productFormPage.save }}" style="border:0;background:#3370ff;color:#fff">保存商品</button></div>
</div>
<div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
  <div style="max-width:900px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">商品当前信息</div>
    <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
      <label>商品编码<input id="pfCode" value="{{ productFormPage.item.code }}"></label>
      <label>商品名称<input id="pfName" value="{{ productFormPage.item.name }}"></label>
      <label>价格（元）<input id="pfPrice" value="{{ productFormPage.item.price }}" inputmode="decimal"></label>
      <label>币种<input id="pfCurrency" value="{{ productFormPage.item.currency }}" maxlength="3"></label>
      <label>库存<input id="pfStock" type="number" min="0" value="{{ productFormPage.item.stockQuantity }}"></label>
      <div style="font-size:12px;color:#8F959E;align-self:end;padding-bottom:10px">服务端版本：{{ productFormPage.item.version }} · 生命周期：{{ productFormPage.item.lifecycle }}</div>
      <label style="grid-column:1/-1">描述<textarea id="pfDescription" rows="5">{{ productFormPage.item.description }}</textarea></label>
    </div>
  </div>
  <div style="max-width:900px;padding:14px 16px;border:1px solid #F5D6A7;border-radius:8px;background:#FFF9F0;font-size:13px;color:#8F5A16">旧图片、素材、员工、标签和外部推送引用保持清空；保存只更新白名单商品当前态。</div>
</div>
