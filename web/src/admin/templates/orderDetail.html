<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
  <div style="display:flex;align-items:center;gap:10px"><button onClick="{{ go.orders }}">←</button><div><div style="font-size:12px;color:#8F959E">交易管理 / 订单详情</div><div style="font-size:16px;font-weight:600;font-family:ui-monospace,Menlo,monospace">{{ orderDetailPage.item.no }}</div></div></div><span style="{{ orderDetailPage.statusStyle }}">{{ orderDetailPage.item.status }}</span>
</div>
<div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
  <div style="max-width:900px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1"><h2 style="margin:0;font-size:14px">订单最终事实</h2><p style="margin:4px 0 0;font-size:12px;color:#8F959E">金额、支付结果和 Provider 最终事实只读。</p></div>
    <div style="padding:16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px"><sc-for list="{{ rows.orderKv }}" as="kv"><span style="font-size:12px;color:#8F959E">{{ kv.k }}</span><span>{{ kv.v }}</span></sc-for><span style="font-size:12px;color:#8F959E">支付来源</span><span>{{ orderDetailPage.item.plat }}</span><span style="font-size:12px;color:#8F959E">最终状态</span><span>{{ orderDetailPage.item.status }}</span></div>
  </div>
  <div style="max-width:900px;padding:14px 16px;border:1px solid #F5D6A7;border-radius:8px;background:#FFF9F0;color:#8F5A16">旧订单事件、旧退款过程、Provider 历史回执和外推记录不进入 V2；本页不提供退款或外部执行。</div>
</div>
