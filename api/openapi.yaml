        - name: limit
          in: query
          required: false
          description: One decimal scalar matching ^-?[0-9]+$; 0 becomes 100, negatives become 1, and values above 500 become 500.
          schema: { type: string, pattern: '^-?[0-9]+$', default: '100' }
        - name: offset
          in: query
          required: false
          description: One decimal scalar matching ^-?[0-9]+$; zero and negatives become 0.
          schema: { type: string, pattern: '^-?[0-9]+$', default: '0' }
        - name: enabled_only
          in: query
          required: false
          description: One lowercase boolean scalar. True (the default) returns enabled rows only; false includes disabled rows and reports their stored enabled value.
          schema: { type: string, enum: ['true', 'false'], default: 'true' }
        - name: q
          in: query
          required: false
          description: One scalar; TrimSpace is applied before PostgreSQL ILIKE matching over name, file_name, description, category, and normalized tags. Percent and underscore retain LIKE wildcard meaning.
          schema: { type: string, default: '' }
        - name: category
          in: query
