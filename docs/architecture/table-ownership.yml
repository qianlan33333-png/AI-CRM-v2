version: 1

policy:
  runtime_write: owner_only
  cross_domain_read: explicit_allowlist_or_port_or_event
  migrations: ddl_only_and_codex_owned
  migration_tool: explicit_mapping_and_target_write_authorization
  reconciler: read_only
  unknown_table: deny

owners:
  contact:
    package: internal/contact
    tables:
      - staff
      - channels
      - stages
      - customers
      - tag_groups
      - tags
      - customer_tags
      - customer_events
      - customer_merge_lineage
      - customer_event_idempotency
      - customer_contact_policies
      - customer_contact_policy_operation_receipts
      - channel_operation_receipts
      - legacy_tag_sync_receipts
      - legacy_tag_live_mutation_receipts
      - legacy_tag_execution_status
    constraints:
      customers: channel_neutral_no_external_ids
      customer_events: append_only
      customer_merge_lineage: contact_owned_effective_customer_projection
      customer_event_idempotency: external_event_fact_registry
      customer_contact_policies: canonical_OneID_local_contact_suppression_policy_without_provider_or_outbound_execution
      customer_contact_policy_operation_receipts: actor_scoped_durable_contact_policy_mutation_receipts
      channels: single_instance_local_channel_resource_without_provider_truth
      channel_operation_receipts: actor_scoped_transactional_create_update_idempotency_receipts
      legacy_tag_sync_receipts: actor_scoped_local_sync_queue_acceptance_receipts_without_provider_execution
      legacy_tag_live_mutation_receipts: actor_scoped_opaque_live_mutation_queue_acceptance_receipts_without_provider_execution
      legacy_tag_execution_status: singleton_fail_closed_local_execution_gate_projection

  identity:
    package: internal/identity
    tables:
      - identities
      - customer_merges
      - pending_events
      - identity_operation_receipts
    constraints:
      identities: customer_id_nullable
      customer_merges: append_only
      pending_events: attribution_pending_and_merge_review_queue
      identity_operation_receipts: transaction_scoped_technical_idempotency_receipts

  segment:
    package: internal/segment
    tables: [segments, segment_members, segment_refresh_receipts, segment_operation_receipts, ai_audience_package_metadata]
    constraints:
      segment_operation_receipts: transaction_scoped_crud_idempotency_receipts
      ai_audience_package_metadata: local_package_lifecycle_and_version_over_authoritative_segment_members

  automation:
    package: internal/automation
    tables: [automations, automation_enrollments, automation_trigger_receipts, automation_agent_configurations, automation_agent_operation_receipts]
    constraints:
      automation_trigger_receipts: unique_tag_trigger_receipt_per_source_event
      automation_agent_configurations: single_instance_configuration_only_without_generation_execution_or_send
      automation_agent_operation_receipts: actor_scoped_transactional_configuration_idempotency_receipts

  outbound:
    package: internal/outbound
    tables: [outbound_batches, outbound_batch_chunks, outbound_tasks, outbound_enqueue_receipts, outbound_send_attempts, outbound_send_attempt_history, outbound_task_job_links, outbound_control_receipts]
    constraints:
      outbound_tasks: provider_result_driven_status_projection_without_retry_scheduling
      outbound_send_attempts: stable_provider_attempt_receipts_owned_by_outbound
      outbound_send_attempt_history: river_attempt_lifecycle_history_without_business_retry_scheduling
      outbound_task_job_links: immutable_outbound_task_to_river_job_generation_link
      outbound_control_receipts: transaction_scoped_idempotent_outbound_control_results

  events:
    package: internal/events
    tables: [event_log, event_deliveries]
    constraints:
      event_log: append_and_dispatch_state_only
      event_deliveries: per_consumer_delivery_state_and_lease

  survey:
    package: internal/survey
    tables: [questionnaires, questionnaire_questions, questionnaire_options, questionnaire_catalog_counters, questionnaire_operation_receipts, questionnaire_management_receipts, questionnaire_submissions, questionnaire_submission_answers]
    constraints:
      questionnaires: single_instance_f01_definition_without_assessment_or_submission_execution
      questionnaire_questions: ordered_frozen_old_UI_question_schema
      questionnaire_options: ordered_choice_schema_without_assessment_execution
      questionnaire_catalog_counters: exact_legacy_total_without_questionnaire_scan
      questionnaire_operation_receipts: actor_scoped_transactional_create_idempotency_receipts
      questionnaire_management_receipts: actor_scoped_transactional_F01B_update_enable_disable_delete_idempotency_receipts
      questionnaire_submissions: immutable_opaque_identity_submission_snapshots_with_counter_sync
      questionnaire_submission_answers: immutable_question_and_option_snapshot_rows_without_definition_fk

  ai:
    package: internal/ai
    tables: [ai_prompts, ai_generations]

  config:
    package: internal/config
    tables: [settings, settings_audit]
    constraints:
      settings: non_secret_only
      settings_audit: append_only_non_secret

  adminops:
    package: internal/adminops
    tables: [admin_ops_credentials, admin_ops_config_categories, admin_ops_config_releases, admin_ops_jobs, admin_ops_action_receipts, admin_ops_notification_settings]
    constraints:
      admin_ops_credentials: secret_reference_and_mask_only_never_credential_material
      admin_ops_config_categories: local_non_secret_runtime_controls_only
      admin_ops_config_releases: local_non_secret_or_secret_reference_release_lifecycle
      admin_ops_jobs: durable_local_intents_with_no_provider_execution_in_request_path
      admin_ops_action_receipts: transaction_scoped_actor_idempotency_receipts
      admin_ops_notification_settings: secret_reference_and_mask_only_no_webhook_url

  auth:
    package: internal/auth
    tables: [admin_users, admin_sessions, admin_oauth_states]
    constraints:
      admin_sessions: token_and_csrf_hashes_only
      admin_oauth_states: hashed_one_time_nonce_and_safe_internal_next_only

  stats:
    package: internal/stats
    tables: [stats_daily, stats_event_receipts]
    constraints:
      stats_event_receipts: unique_projection_receipt_per_source_event

  product:
    package: internal/product
    tables: [products, product_images, product_catalog_counters, product_operation_receipts, service_period_members, service_period_member_operation_receipts]
    constraints:
      products: ordinary_product_catalog_and_allowlisted_legacy_admin_projection
      product_images: product_owned_native_image_urls_only
      product_catalog_counters: exact_legacy_total_without_catalog_scan
      product_operation_receipts: transaction_scoped_create_idempotency_receipts
      service_period_members: local_OneID_membership_facts_with_opaque_member_reference_and_no_external_identifiers
      service_period_member_operation_receipts: actor_scoped_transactional_member_mutation_idempotency_receipts

  coupon:
    package: internal/coupon
    tables: [coupons, coupon_targets, coupon_catalog_counters, coupon_operation_receipts, coupon_claims, coupon_payment_identity_sessions, coupon_sidebar_grants]
    constraints:
      coupons: single_instance_coupon_rule_and_lifecycle_facts
      coupon_targets: typed_standard_product_references_validated_through_product_read_port
      coupon_catalog_counters: exact_unfiltered_legacy_total_without_coupon_scan
      coupon_operation_receipts: transaction_scoped_mutation_receipts_without_create_replay_claim
      coupon_claims: durable_local_claim_facts_with_opaque_transport_reference_and_no_customer_foreign_key
      coupon_payment_identity_sessions: opaque_digest_to_trusted_OneID_resolution_for_self_scoped_coupon_claim
      coupon_sidebar_grants: opaque_digest_to_owner_scoped_sidebar_coupon_read_and_not_a_claim_credential

  order:
    package: internal/order
    tables: [order_list_projections, order_list_projection_counters, order_operation_receipts, order_export_jobs, order_external_effects, order_refunds]
    constraints:
      order_list_projections: read_only_unified_order_projection_without_payment_or_provider_execution
      order_list_projection_counters: exact_unfiltered_order_total_without_projection_scan
      order_operation_receipts: actor_scoped_transactional_export_refund_and_review_idempotency_receipts
      order_export_jobs: local_completed_csv_export_content_without_external_object_storage
      order_external_effects: durable_provider_call_gate_with_outcome_unknown_never_auto_retried
      order_refunds: durable_local_refund_intent_without_provider_execution

  media:
    package: internal/media
    tables: [media_images, media_image_blobs, media_image_upload_receipts, media_image_delete_receipts, media_group_invites, media_group_invite_operation_receipts, media_thumbnail_cache_entries, media_miniprograms, media_miniprogram_import_preflights, media_miniprogram_import_ledger, media_miniprogram_operation_receipts]
    constraints:
      media_images: validated_single_instance_image_metadata
      media_image_blobs: exact_validated_image_bytes_owned_by_media
      media_image_upload_receipts: actor_scoped_transactional_upload_idempotency_receipts
      media_image_delete_receipts: actor_scoped_transactional_delete_idempotency_receipts
      media_group_invites: local_only_group_invite_metadata_with_read_only_media_image_reference
      media_group_invite_operation_receipts: actor_operation_business_key_scoped_transactional_mutation_receipts
      media_thumbnail_cache_entries: media_owned_local_thumbnail_cache_with_outcome_unknown_no_retry
      media_miniprograms: stable_single_instance_miniprogram_metadata_with_legacy_source_lineage
      media_miniprogram_import_preflights: immutable_external_gate_snapshot_with_one_way_reconciliation_state
      media_miniprogram_import_ledger: immutable_per_source_row_remap_rebuild_drop_and_human_decision_lineage
      media_miniprogram_operation_receipts: actor_operation_business_target_digest_state_and_result_receipts

  operationcycle:
    package: internal/operationcycle
    tables:
      - operation_cycle_strategies
      - operation_cycle_runs
      - operation_cycle_report_receipts
      - operation_cycle_runners
      - operation_cycle_action_requests
      - operation_cycle_action_request_events
      - operation_cycle_strategy_proposals
    constraints:
      operation_cycle_strategies: single_instance_local_strategy_snapshot_without_tenant_or_provider_credentials
      operation_cycle_report_receipts: actor_scoped_semantic_json_idempotency_receipts
      operation_cycle_runners: service_authenticated_local_runner_compatibility_facts
      operation_cycle_action_requests: queued_claimed_thread_bound_turn_started_terminal_state_machine_without_external_effect_execution
      operation_cycle_action_request_events: immutable_idempotent_action_lifecycle_evidence
      operation_cycle_strategy_proposals: local_pending_accepted_rejected_proposals_without_automatic_execution

  pushcenter:
    package: internal/pushcenter
    tables: [push_center_read_model_state, push_center_read_model_entries]
    constraints:
      push_center_read_model_state: global_fail_closed_readiness_only_without_worker_or_provider_execution
      push_center_read_model_entries: global_internal_push_status_projection_without_tenant_or_cross_domain_foreign_key

  groupops:
    package: internal/groupops
    tables: [group_ops_plans, group_ops_plan_members, group_ops_plan_group_assets, group_ops_plan_nodes, group_ops_plan_webhook_descriptors, group_ops_operation_receipts]
    constraints:
      group_ops_plans: local_only_draft_active_paused_archived_plan_control_plane
      group_ops_plan_members: local_operator_member_bindings_without_directory_or_provider_sync
      group_ops_plan_group_assets: opaque_local_group_asset_references_without_group_provider_reads
      group_ops_plan_nodes: local_standard_content_nodes_without_runtime_or_send_execution
      group_ops_plan_webhook_descriptors: opaque_safe_descriptors_without_url_credential_payload_or_dispatch
      group_ops_operation_receipts: transaction_scoped_actor_idempotency_receipts

  campaign:
    package: internal/campaign
    tables:
      - cloud_campaigns
      - cloud_campaign_steps
      - cloud_campaign_local_plans
      - cloud_campaign_local_commands
      - cloud_campaign_operation_receipts
      - cloud_campaign_touch_plans
      - cloud_campaign_touch_plan_targets
      - cloud_campaign_touch_plan_steps
      - cloud_campaign_touch_plan_receipts
      - cloud_campaign_touch_plan_reviews
      - cloud_campaign_touch_plan_review_receipts
      - cloud_campaign_touch_plan_handoffs
    constraints:
      cloud_campaigns: local_campaign_control_plane_only
      cloud_campaign_steps: ordered_campaign_content_without_material_reference_or_runtime_execution
      cloud_campaign_local_plans: local_start_control_plane_only
      cloud_campaign_local_commands: local_start_command_without_real_send_or_runtime_execution
      cloud_campaign_operation_receipts: actor_scoped_transactional_campaign_control_receipts
      cloud_campaign_touch_plans: immutable_campaign_owned_snapshot_without_provider_or_dispatch
      cloud_campaign_touch_plan_targets: immutable_canonical_OneID_snapshot_without_customer_fk
      cloud_campaign_touch_plan_steps: immutable_campaign_step_content_snapshot_without_material_reference
      cloud_campaign_touch_plan_receipts: actor_scoped_plan_event_bound_transactional_create_receipts
      cloud_campaign_touch_plan_reviews: campaign_owned_review_sidecar_with_cas_terminal_decision
      cloud_campaign_touch_plan_review_receipts: actor_scoped_durable_review_result_snapshot_receipts
      cloud_campaign_touch_plan_handoffs: approved_review_bound_pending_local_handoff_without_provider_execution

  hxc:
    package: internal/hxc
    tables: [hxc_sender_configs]
    constraints:
      hxc_sender_configs: single_instance_local_sender_configuration_without_provider_directory_or_broadcast_execution

  ops:
    package: internal/ops
    tables: []
    constraints:
      access: platform_and_domain_ports_only

  wecom:
    package: internal/wecom
    tables: [wecom_sync_state, wecom_message_archive_records, wecom_message_archive_sync_receipts]
    constraints:
      wecom_message_archive_records: local_redacted_message_projection_with_logical_OneID_customer_attribution_and_no_cross_domain_foreign_key
      wecom_message_archive_sync_receipts: actor_scoped_accepted_only_sync_command_idempotency_without_provider_or_worker_execution

  gateway:
    package: internal/gateway
    tables:
      - extension_api_keys
      - extension_api_audit
      - extension_webhook_endpoints
      - extension_webhook_deliveries
    constraints:
      extension_api_keys: token_hash_only
      extension_api_audit: append_only
      extension_webhook_endpoints: encrypted_or_derived_signing_material
      extension_webhook_deliveries: append_only_delivery_attempts

external_owners:
  river:
    writer: github.com/riverqueue/river
    version: 0.24.0
    source: https://github.com/riverqueue/river/tree/v0.24.0/riverdriver/riverpgxv5/migration/main
    tables:
      - river_client
      - river_client_queue
      - river_job
      - river_leader
      - river_migration
      - river_queue
    application_access: platform_port_only

  goose:
    writer: github.com/pressly/goose
    tables: [goose_db_version]
    application_access: none

cross_domain_read_allowlist:
  segment:
    tables: [customers, customer_tags, tags]
    reason: indexed_audience_compilation
  outbound:
    tables: [segment_members]
    reason: atomic_batch_expansion
  stats:
    tables: [customers, customer_events, outbound_tasks]
    reason: daily_read_only_aggregation

exceptions:
  - path: migrations
    access: schema_ddl
    runtime_dml: false
  - path: tools/migrate-from-v1
    access: explicitly_mapped_target_write
    requires:
      - human_signed_mapping
      - explicit_target_write_authorization
      - declared_target_environment
  - path: tools/reconciler
    access: read_only
    runtime_dml: false
