name: policy / repo-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: repo-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-contract:
    name: policy / repo-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact-main verification mode
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci_promotion_decision.sh
      - name: Verify repository contract
        if: steps.promotion.outputs.mode == 'full'
        run: scripts/check_repo_contract.sh
      - name: Verify repository contract negative cases
        if: steps.promotion.outputs.mode == 'full'
        run: scripts/test_repo_contract.sh
      - name: Verify promotion fingerprints
        if: steps.promotion.outputs.mode == 'promotion'
        env:
          CI_PROMOTION_AFFECTED_MANIFEST: ${{ steps.promotion.outputs.affected_manifest }}
        run: scripts/check_ci_promotion_smoke.sh
