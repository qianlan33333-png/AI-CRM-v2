<main style="flex:1;overflow:auto;padding:20px;background:#F5F6F7">
  <h1 style="font-size:22px">{{ title }}</h1>
  <p style="white-space:pre-wrap;color:#646A73">{{ description }}</p>
  <sc-if value="{{ loading }}"><p role="status">正在读取真实问卷…</p></sc-if>
  <sc-if value="{{ error }}"><p role="alert" data-h5-error style="color:#D83931">{{ error }}</p></sc-if>
  <sc-if value="{{ canRetry }}"><button type="button" onClick="{{ act.retry }}">重试读取</button></sc-if>
  <sc-if value="{{ ready }}">
    <p data-h5-progress>{{ progress }}</p>
    <sc-for list="{{ questions }}" as="question">
      <section data-question-id="{{ question.id }}" style="padding:16px;margin:14px 0;border:1px solid #DEE0E3;border-radius:12px;background:#fff">
        <h2 style="font-size:17px">{{ question.title }} {{ question.required }}</h2>
        <p style="font-size:13px;color:#646A73">{{ question.hint }}</p>
        <sc-for list="{{ question.options }}" as="option">
          <button type="button" data-option-id="{{ option.id }}" aria-pressed="{{ option.selected }}" onClick="{{ option.pick }}" style="display:block;width:100%;margin:8px 0;padding:12px;text-align:left;border:1px solid;border-radius:8px;cursor:pointer;{{ option.style }}">{{ option.mark }} {{ option.text }}</button>
        </sc-for>
      </section>
    </sc-for>
    <div style="display:flex;gap:12px">
      <sc-if value="{{ canPrevious }}"><button type="button" data-h5-previous onClick="{{ act.previous }}">上一题</button></sc-if>
      <sc-if value="{{ canNext }}"><button type="button" data-h5-next onClick="{{ act.next }}">下一题</button></sc-if>
      <sc-if value="{{ canSubmit }}"><button type="button" data-h5-submit onClick="{{ act.submit }}">提交</button></sc-if>
    </div>
    <sc-if value="{{ submitting }}"><p role="status">正在提交，请勿重复操作…</p></sc-if>
  </sc-if>
  <sc-if value="{{ submitted }}">
    <section data-h5-receipt><h2>已收到本地提交回执</h2><p>外部推送、支付和授权均未执行。</p><a data-h5-result-link href="{{ resultPath }}">查询真实提交结果</a></section>
  </sc-if>
</main>
