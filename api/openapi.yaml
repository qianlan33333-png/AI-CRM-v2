        sort_order: { type: integer, minimum: 0, maximum: 99 }
        answered_count: { type: integer, format: int64, minimum: 0 }
        options: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PublicSurveyAnalyticsOption" } }
    PublicSurveyAnalyticsOption:
