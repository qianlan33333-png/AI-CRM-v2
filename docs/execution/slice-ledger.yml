    P2: 12_files_800_lines
    P3_P4: 12_files_1000_lines
    hard_cap: 15_files_1500_lines
  correction_stop_threshold:
    slice_induced: gte_3
    infra_scope_verification_count_toward_stop: false
  rolling_three_slice_average_threshold: slice_induced_average_gt_1
  merge_method: squash
  pr_language: zh-CN
  external_effects_default: forbidden
current_phase: P3
current_phase_status: P3_CONTACT_TIMELINE_PARTITIONS_IN_PROGRESS_G2_EXTERNAL_GATES_RETAINED
ledger_semantics:
  historical_slice_records: point_in_time_receipts
  current_phase_status_source: phase_closeouts
  historical_unknown_correction_count: null_not_zero
  legacy_correction_count_field: preserved_for_records_before_M0_6
  correction_attribution:
    slice_induced: slice_code_or_design_defect
    infra_induced: existing_gate_toolchain_environment_or_ci_defect
    scope_induced: slice_card_scope_was_underdefined
    verification_induced: verification_command_environment_or_evidence_invocation_defect
    infra_disposition: same_slice_or_independent_fix_slice_by_complete_behavior
    non_slice_attributions_stop_independently: false
    slice_induced_gte_3_requires_stop_report: true
    scope_induced_requires_rescope_not_counter_reset: true
  reporting:
    P2: phase_completion
    P3: each_wave_completion
    immediate_stop_gates:
      - real_external_effect
      - irreversible_identity_semantic_disagreement
      - substantive_auth_secret_wecom_credential_change
      - user_real_input_or_manual_acceptance_required
      - substantive_ADR_or_architecture_law_conflict
