          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div><div style="font-size:12px;color:#8F959E">运营 / 渠道</div><div style="font-size:16px;font-weight:600">{{ channelFormPage.title }}</div></div>
            <div style="display:flex;gap:8px"><button onClick="{{ go.channels }}" style="height:30px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;font-size:13px;cursor:pointer">返回列表</button><button onClick="{{ channelFormPage.save }}" style="height:30px;padding:0 14px;border:0;border-radius:6px;background:#3370ff;color:#fff;font-size:13px;cursor:pointer">保存渠道</button></div>
          </div>
          <div style="flex:1;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start">
            <div style="max-width:1100px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">渠道与载体配置</div>
              <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">渠道名称<input id="channelName" value="{{ channelFormPage.item.name }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">渠道编码<input id="channelCode" value="{{ channelFormPage.item.code }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">渠道类型<select id="channelType" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;background:#fff"><sc-if value="{{ channelFormPage.item.qrcodeType }}"><option value="qrcode" selected="selected">二维码</option><option value="wecom_customer_acquisition">企微获客链接</option></sc-if><sc-if value="{{ channelFormPage.item.acquisitionType }}"><option value="qrcode">二维码</option><option value="wecom_customer_acquisition" selected="selected">企微获客链接</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">载体类型<select id="channelCarrier" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;background:#fff"><sc-if value="{{ channelFormPage.item.qrcodeCarrier }}"><option value="qrcode" selected="selected">二维码</option><option value="link">链接</option></sc-if><sc-if value="{{ channelFormPage.item.linkCarrier }}"><option value="qrcode">二维码</option><option value="link" selected="selected">链接</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">状态<select id="channelStatus" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;background:#fff"><sc-if value="{{ channelFormPage.item.statusActive }}"><option value="active" selected="selected">启用</option><option value="inactive">停用</option><option value="archived">归档</option></sc-if><sc-if value="{{ channelFormPage.item.statusInactive }}"><option value="active">启用</option><option value="inactive" selected="selected">停用</option><option value="archived">归档</option></sc-if><sc-if value="{{ channelFormPage.item.statusArchived }}"><option value="active">启用</option><option value="inactive">停用</option><option value="archived" selected="selected">归档</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">场景值<input id="channelScene" value="{{ channelFormPage.item.sceneValue }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">二维码 URL<input id="channelQrUrl" value="{{ channelFormPage.item.qrUrl }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">链接 URL<input id="channelLinkUrl" value="{{ channelFormPage.item.linkUrl }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">最终 URL<input id="channelFinalUrl" value="{{ channelFormPage.item.finalUrl }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">客户渠道标识<input id="channelCustomerChannel" value="{{ channelFormPage.item.customerChannel }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px"></label>
              </div>
            </div>
            <div style="max-width:1100px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">客服、欢迎语、素材与标签</div>
              <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">负责人 staff ID<input id="channelOwner" value="{{ channelFormPage.item.ownerStaffId }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">入渠标签 ID<input id="channelTagId" value="{{ channelFormPage.item.entryTagId }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">入渠标签名<input id="channelTagName" value="{{ channelFormPage.item.entryTagName }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">入渠标签组名<input id="channelTagGroup" value="{{ channelFormPage.item.entryTagGroupName }}" style="height:36px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px"></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">欢迎语<textarea id="channelWelcome" rows="4" style="border:1px solid #DEE0E3;border-radius:6px;padding:8px 10px">{{ channelFormPage.item.welcomeMessage }}</textarea></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">图片素材 ID<input id="channelImageIds" value="{{ channelFormPage.item.imageIds }}" placeholder="1, 2"></label><label style="display:grid;gap:6px;font-size:12px;color:#646A73">小程序素材 ID<input id="channelMiniIds" value="{{ channelFormPage.item.miniIds }}" placeholder="3"></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">附件素材 ID<input id="channelAttachmentIds" value="{{ channelFormPage.item.attachmentIds }}" placeholder="4"></label><label style="display:grid;gap:6px;font-size:12px;color:#646A73">群邀请素材 ID<input id="channelGroupInviteIds" value="{{ channelFormPage.item.groupInviteIds }}" placeholder="5"></label>
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#646A73"><sc-if value="{{ channelFormPage.item.autoAcceptFriend }}"><input id="channelAutoAccept" type="checkbox" checked="checked"></sc-if><sc-if value="{{ channelFormPage.item.autoAcceptOff }}"><input id="channelAutoAccept" type="checkbox"></sc-if>自动通过好友</label>
              </div>
            </div>
            <div style="max-width:1100px;background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="padding:12px 16px;border-bottom:1px solid #EFF0F1;font-size:14px;font-weight:600">分配策略</div>
              <div style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">分配模式<select id="channelAssignmentMode"><sc-if value="{{ channelFormPage.item.singleOwner }}"><option value="single_owner" selected="selected">单负责人</option><option value="multi_staff">多客服</option></sc-if><sc-if value="{{ channelFormPage.item.multiStaff }}"><option value="single_owner">单负责人</option><option value="multi_staff" selected="selected">多客服</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">分配策略<select id="channelAssignmentStrategy"><sc-if value="{{ channelFormPage.item.ratio }}"><option value="ratio" selected="selected">比例</option><option value="cap_switch">容量切换</option></sc-if><sc-if value="{{ channelFormPage.item.capSwitch }}"><option value="ratio">比例</option><option value="cap_switch" selected="selected">容量切换</option></sc-if></select></label>
                <label style="display:grid;gap:6px;font-size:12px;color:#646A73">溢出策略<input id="channelOverflow" value="{{ channelFormPage.item.overflowPolicy }}"></label>
                <label style="grid-column:1/-1;display:grid;gap:6px;font-size:12px;color:#646A73">分配配置 JSON<textarea id="channelAssignmentConfig" rows="6" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace">{{ channelFormPage.item.assignmentConfigJson }}</textarea></label>
              </div>
            </div>
            <div style="max-width:1100px;padding:14px 16px;border:1px solid #F5D6A7;border-radius:8px;background:#FFF9F0;font-size:13px;color:#8F5A16">保存只形成后端本地渠道事实；不代表二维码已生成、获客链接已同步或企微 Provider 已执行。</div>
          </div>
