components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
    PaymentIdentitySession:
      type: apiKey
      in: cookie
      name: aicrm_payment_identity
      description: Opaque trusted payment-identity session; the server resolves its digest to a customer and never accepts caller-supplied customer identity.
    SidebarGrant:
      type: apiKey
      in: cookie
      name: aicrm_sidebar_grant
      description: Opaque owner-scoped sidebar grant; it is not interchangeable with a payment-identity session.
  parameters:
    AutomationAgentID:
      name: agent_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ProductID:
      name: product_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    EntitlementID:
      name: entitlement_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    EntitlementLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller key; reusing it with a different normalized command is a conflict.
      schema: { type: string, minLength: 16, maxLength: 128 }
    QuestionnaireID:
      name: questionnaire_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PublicSurveySlug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9][a-z0-9-]{0,119}$' }
    MergeReviewID:
      name: review_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SegmentID:
      name: segment_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StageID:
      name: stage_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TagGroupID:
      name: group_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor; clients must not parse or synthesize it.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CustomerKeyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    OwnerStaffIDFilter:
      name: owner_staff_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    StageIDFilter:
      name: stage_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    ChannelIDFilter:
