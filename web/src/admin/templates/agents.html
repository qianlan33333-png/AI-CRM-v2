<div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3"><div><div style="font-size:12px;color:#8F959E">配置及后台</div><div style="font-size:16px;font-weight:600">HXC 发送人配置</div></div><div style="display:flex;gap:8px"><button onClick="{{ hxcPage.refresh }}">校验发送资格</button><button onClick="{{ hxcPage.create }}" style="height:30px;padding:0 12px;border:0;border-radius:6px;background:#3370ff;color:#fff">新增发送人</button></div></div>
<div style="padding:16px 20px;display:grid;gap:12px;overflow:auto">
  <div style="padding:12px 14px;border:1px solid #D6E4FF;background:#F5F8FF;border-radius:8px;color:#245BDB;font-size:13px">此工作区只维护 CRM 本地发送人白名单，不调用企微通讯录或执行发送。</div>
  <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="padding:10px;text-align:left">显示名 / sender_userid</th><th style="padding:10px;text-align:left">配置 ID</th><th style="padding:10px;text-align:left">优先级</th><th style="padding:10px;text-align:left">状态</th><th style="padding:10px;text-align:right">操作</th></tr></thead><tbody><sc-for list="{{ hxcPage.rows }}" as="r"><tr><td style="padding:10px;border-top:1px solid #F2F3F5"><b>{{ r.name }}</b><div style="font:12px ui-monospace;color:#8F959E">{{ r.code }}</div></td><td style="padding:10px;border-top:1px solid #F2F3F5">{{ r.senderId }}</td><td style="padding:10px;border-top:1px solid #F2F3F5">{{ r.priority }}</td><td style="padding:10px;border-top:1px solid #F2F3F5"><span style="{{ r.cs }}">{{ r.status }}</span></td><td style="padding:10px;border-top:1px solid #F2F3F5;text-align:right"><button onClick="{{ r.edit }}">编辑</button> <button onClick="{{ r.archive }}">归档</button></td></tr></sc-for></tbody></table></div>
  <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;padding:16px"><h3 style="margin:0 0 6px;font-size:14px">完整顺序</h3><p style="margin:0 0 10px;font-size:12px;color:#8F959E">每行一个配置 ID；保存调用本地 reorder operation。</p><textarea id="hxcOrder" rows="6" style="width:100%;box-sizing:border-box;font:13px ui-monospace,Menlo,monospace">{{ hxcPage.orderText }}</textarea><div style="text-align:right;margin-top:10px"><button onClick="{{ hxcPage.reorder }}">保存顺序</button></div></div>
</div>
