name: policy / repo-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-contract:
    name: policy / repo-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository contract
        run: scripts/check_repo_contract.sh
      - name: Verify repository contract negative cases
        run: scripts/test_repo_contract.sh
