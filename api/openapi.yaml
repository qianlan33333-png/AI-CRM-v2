openapi: 3.0.3
info:
  title: AI-CRM v2 API
  version: 0.4.0-p3-contact
  description: Canonical HTTP contract. Generated code must not be edited. P3-C00 freezes the channel-neutral contact API before contact implementation begins.
security:
  - AdminSession: []
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/customers:
    get:
      tags: [p3-contact]
      operationId: listCustomers
      summary: List customers using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0609]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CustomerKeyword"
        - $ref: "#/components/parameters/OwnerStaffIDFilter"
        - $ref: "#/components/parameters/StageIDFilter"
        - $ref: "#/components/parameters/ChannelIDFilter"
        - $ref: "#/components/parameters/TagIDFilter"
        - $ref: "#/components/parameters/IsDeletedFilter"
        - $ref: "#/components/parameters/AddedAfterFilter"
        - $ref: "#/components/parameters/AddedBeforeFilter"
        - $ref: "#/components/parameters/LastInteractAfterFilter"
        - $ref: "#/components/parameters/LastInteractBeforeFilter"
      responses:
        "200":
          description: Customer page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p3-contact]
      operationId: getCustomer
      summary: Get a channel-neutral customer by OneID
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0619, LEGACY-API-0743]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [p3-contact]
      operationId: updateCustomer
      summary: Update customer-owned profile fields
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0736]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/{customer_id}/stage:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    put:
      tags: [p3-contact]
      operationId: setCustomerStage
      summary: Set or clear a customer's stage
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCustomerStageRequest"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/{customer_id}/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
      - $ref: "#/components/parameters/TagID"
    put:
      tags: [p3-contact]
      operationId: addCustomerTag
      summary: Idempotently apply one local tag to a customer
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Tag is present. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [p3-contact]
      operationId: removeCustomerTag
      summary: Idempotently remove one local tag from a customer
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Tag is absent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/customers/{customer_id}/events:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p3-contact]
      operationId: listCustomerEvents
      summary: List append-only customer events using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0620, LEGACY-API-0739, LEGACY-API-0745]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customer.events.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customer event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEventListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tags:
    get:
      tags: [p3-contact]
      operationId: listTags
      summary: List the local tag catalog in deterministic order
      x-legacy-mapping-ids: [LEGACY-API-0551, LEGACY-API-0555]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      responses:
        "200":
          description: Tag catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/stages:
    get:
      tags: [p2-stages]
      operationId: listStages
      summary: List global customer stages in deterministic order
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: global }
      responses:
        "200":
          description: Ordered stage definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [p2-stages]
      operationId: createStage
      summary: Create one global customer stage
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStageRequest"
      responses:
        "201":
          description: Created stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/stages/{stage_id}:
    parameters:
      - $ref: "#/components/parameters/StageID"
    patch:
      tags: [p2-stages]
      operationId: renameStage
      summary: Rename one global customer stage
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameStageRequest"
      responses:
        "200":
          description: Renamed stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/identity/resolve:
    post:
      tags: [p1-core-candidate]
      operationId: resolveIdentity
      summary: Resolve one scoped identity without implicit creation
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0355, LEGACY-API-0680]
      x-aicrm-capability: identity.resolve
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIdentityRequest"
      responses:
        "200":
          description: Found, not-found, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/identity/bind:
    post:
      tags: [p1-core-candidate]
      operationId: bindIdentity
      summary: Bind a scoped identity to a channel-neutral customer
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0709]
      x-aicrm-capability: identity.bind
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindIdentityRequest"
      responses:
        "200":
          description: Bind or merge-policy result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindIdentityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/identity/ingest:
    post:
      tags: [p1-core-candidate]
      operationId: ingestIdentityEvent
      summary: Attribute or persist an external event without guessing identity
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0780]
      x-aicrm-capability: identity.ingest
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestIdentityEventRequest"
      responses:
        "200":
          description: Attributed, pending, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestIdentityEventResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/session:
    get:
      tags: [p1-core-candidate]
      operationId: getAuthSession
      summary: Return the authenticated admin principal
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0758]
      x-aicrm-capability: auth.session.read
      x-aicrm-rbac-scopes: { admin: self, ops: self, sales: self }
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [p1-core-candidate]
      operationId: logoutAdmin
      summary: Invalidate the current admin session
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0760]
      x-aicrm-capability: auth.session.logout
      x-aicrm-rbac-scopes: { admin: self, ops: self, sales: self }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Session invalidated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/config/overview:
    get:
      tags: [p1-core-candidate]
      operationId: getAdminConfigOverview
      summary: List non-secret configuration readiness
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0269]
      x-aicrm-capability: config.overview.read
      x-aicrm-rbac-scopes: { admin: global }
      responses:
        "200":
          description: Non-secret configuration readiness only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigOverviewResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: aicrm_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the server-side browser session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StageID:
      name: stage_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor; clients must not parse or synthesize it.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CustomerKeyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    OwnerStaffIDFilter:
      name: owner_staff_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    StageIDFilter:
      name: stage_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    ChannelIDFilter:
      name: channel_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    TagIDFilter:
      name: tag_id
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
    IsDeletedFilter:
      name: is_deleted
      in: query
      required: false
      schema: { type: boolean, default: false }
    AddedAfterFilter:
      name: added_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    AddedBeforeFilter:
      name: added_before
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractAfterFilter:
      name: last_interact_after
      in: query
      required: false
      schema: { type: string, format: date-time }
    LastInteractBeforeFilter:
      name: last_interact_before
      in: query
      required: false
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Principal lacks the capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Current state conflicts with the command.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnprocessableEntity:
      description: The command violates a field-level validation rule.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, is_deleted, extra, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, minimum: -32768, maximum: 32767, nullable: true }
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        added_at: { type: string, format: date-time, nullable: true }
        last_interact_at: { type: string, format: date-time, nullable: true }
        is_deleted: { type: boolean }
        extra: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        gender: { type: integer, format: int32, minimum: -32768, maximum: 32767, nullable: true }
        owner_staff_id: { type: integer, format: int64, minimum: 1, nullable: true }
        channel_id: { type: integer, format: int64, minimum: 1, nullable: true }
        extra: { type: object, additionalProperties: true }
    SetCustomerStageRequest:
      type: object
      additionalProperties: false
      required: [stage_id]
      properties:
        stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
    CustomerListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total, total_is_estimate, watermark]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
        total: { type: integer, format: int64, minimum: 0 }
        total_is_estimate: { type: boolean }
        watermark: { type: string, format: date-time }
    CustomerDetailResponse:
      type: object
      additionalProperties: false
      required: [customer, tags]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    CustomerEvent:
      type: object
      additionalProperties: false
      required: [id, customer_id, event_type, payload, actor, occurred_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        customer_id: { type: integer, format: int64, minimum: 1 }
        event_type: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        actor: { type: string, minLength: 1, maxLength: 200 }
        occurred_at: { type: string, format: date-time }
    CustomerEventListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CustomerEvent" } }
        next_cursor: { type: string, minLength: 1, nullable: true }
