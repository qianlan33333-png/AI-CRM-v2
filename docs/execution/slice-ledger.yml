execution_policy:
  orchestrator: Codex-Sol
  execution_mode: sol_vertical_slice
  phase_strategy:
    P0: sol_end_to_end
    P1: terra_grouped_investigation_sol_decision
    P2: sol_shared_core_delegated_isolated_components
    P3_P4: sol_command_terra_parallel_after_contract_freeze
    migration_reconciliation: independent_agent_required
  max_active_terra_tasks: 3
  executor_model: gpt-5.6-sol
  reasoning_effort: root_session
  task_graph: vertical_slice_then_conditional_dag
  architecture_implementation_acceptance_git_main_ci: non_shared_business_prs_parallel_central_contract_and_merge_main_ci_serial
  sol_receipt_fields:
    - pr_head_sha
    - merge_sha
    - main_ci_status
    - slice_induced_correction_count
    - infra_induced_correction_count
    - scope_induced_correction_count
    - verification_induced_correction_count
  delegated_terra_receipts: full_hash_manifest_only_when_actually_delegated
  delegated_receipt: payload_manifest_including_untracked
  file_manifest_format: sorted_MODE_BYTES_SHA256_PATH
  canonical_diff: root_staged_git_diff_cached_binary_base_payload_paths
  receipt_carrier_integrity: pr_head_and_merge_sha
  handwritten_limits:
    P2: 12_files_800_lines
    P3_P4: 12_files_1000_lines
    hard_cap: 15_files_1500_lines
  correction_state_machine:
    non_redline_slice_induced_1: ACTIVE_REPAIR_ALLOWED
    non_redline_slice_induced_gte_2: SCOPE_FROZEN_REPAIR_ONLY
    non_redline_slice_induced_gte_3_discards_candidate: false
    repair_only_allows: existing_defect_fixes_permanent_negatives_original_DoD_generated_manifest_ledger_rebase_required_CI_PR_merge_exact_main_CLOSED
    redline_any_count: HARD_STOP_REDLINE_READ_ONLY
    redline_action: stop_repair_rerun_generate_commit_push_PR_merge_then_fresh_task_from_latest_exact_green
    infra_scope_verification_count_toward_state: false
  redline_categories:
    - tenant_actor_auth_data_isolation_or_cross_tenant_privilege_violation
    - security_boundary_auth_bypass_secret_leak_injection_or_open_redirect
    - cross_domain_ownership_or_required_transaction_atomicity_violation
    - duplicate_payment_refund_provider_real_external_effect_or_outcome_unknown_auto_retry
    - irreversible_data_damage_or_migration_loss
    - unauthorized_production_write_or_real_wecom_send_payment_refund_external_operation
  non_redline_examples: implementation_error_error_classification_JSON_normalization_sentinel_chain_file_structure_lint_test_assertion_performance_index_when_no_redline_is_touched
  policy_effective_scope: forward_only_after_policy_merge_for_fresh_or_no_WIP_candidates
  historical_hard_stops_retroactive_revival: false
  expected_artifact_sync: definition_of_done_not_correction
  p3_p4_pr_closure: official_business_slice_or_approved_feature_matrix_flow
  p3_p4_non_business_prs: forbidden_after_one_time_slice_correction_policy_revision
  independent_security_slice: irreversible_data_pollution_auth_migration_or_real_external_send_only
  merge_method: squash
  pr_language: zh-CN
  external_effects_default: forbidden
current_phase: P3
current_phase_status: P3_CONTACT_S_TIER_QUERY_OPTIMIZATION_IN_PROGRESS_G2_EXTERNAL_GATES_RETAINED
ledger_semantics:
  historical_slice_records: point_in_time_receipts
  current_phase_status_source: phase_closeouts
  historical_unknown_correction_count: null_not_zero
  legacy_correction_count_field: preserved_for_records_before_M0_6
  correction_attribution:
    slice_induced: slice_code_or_design_defect
    infra_induced: existing_gate_toolchain_environment_or_ci_defect
    scope_induced: slice_card_scope_was_underdefined
    verification_induced: verification_command_environment_or_evidence_invocation_defect
    infra_disposition: same_task_unless_shared_infrastructure_or_business_scope_changes
    expected_artifact_omission_first_gate_detection: one_verification_induced_then_same_task_completion
    non_slice_attributions_stop_independently: false
    non_redline_slice_induced_gte_3_requires_candidate_discard: false
    redline_any_count_requires_HARD_STOP_REDLINE_READ_ONLY: true
    historical_W0_A_H_I_and_two_W0_candidates: permanent_read_only_no_revival_copy_or_cherry_pick
    scope_induced_requires_rescope_not_counter_reset: true
  reporting:
    P2: phase_completion
    P3: each_wave_completion
    immediate_stop_gates:
      - real_external_effect
      - irreversible_identity_semantic_disagreement
      - substantive_auth_secret_wecom_credential_change
      - user_real_input_or_manual_acceptance_required
      - substantive_ADR_or_architecture_law_conflict
  sol_receipts_are_forward_recorded: true
