openapi: 3.0.3
info:
  title: AI-CRM v2 API
  version: 0.6.0-p3-segment-contract
  description: Canonical HTTP contract. Generated code must not be edited. P3-I00 freezes fail-closed identity semantics and P3-S00 freezes Segment DSL v1 before implementation begins.
security:
  - AdminSession: []
paths:
  /api/v1/products:
    get:
      tags: [p4-product]
      operationId: listProducts
      summary: List ordinary products using a keyset cursor
      x-legacy-mapping-ids: [LEGACY-API-0525]
      x-p4-decision-evidence: P4-I01A-2026-08-14
      x-aicrm-capability: products.read
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Product page, content: {application/json: {schema: {$ref: "#/components/schemas/ProductPage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [p4-product]
      operationId: createProduct
      summary: Create one ordinary product
      x-legacy-mapping-ids: [LEGACY-API-0526]
      x-p4-decision-evidence: P4-I01A-2026-08-14
      x-aicrm-capability: products.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters: [{$ref: "#/components/parameters/CSRFToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateProductRequest"}}}}
      responses:
        "201": {description: Product created, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/products/{product_id}:
    get:
      tags: [p4-product]
      operationId: getProduct
      summary: Get one ordinary product
      x-legacy-mapping-ids: [LEGACY-API-0530]
      x-p4-decision-evidence: P4-I01A-2026-08-14
      x-aicrm-capability: products.read
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters: [{$ref: "#/components/parameters/ProductID"}]
      responses:
        "200": {description: Product, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/customers:
    get:
      tags: [p4-customer-compat]
      operationId: listLegacyCustomers
      summary: List the channel-neutral customer projection for the frozen old UI
      x-legacy-mapping-ids: [LEGACY-API-0609]
      x-p4-decision-evidence: P4-B01-2026-08-15
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - { name: owner_userid, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: is_bound, in: query, schema: { type: string } }
        - { name: mobile, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 0, default: 0 } }
      responses:
        "200": { description: Frozen legacy customer list envelope, content: { application/json: { schema: { $ref: "#/components/schemas/LegacyCustomerListResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/customers/{external_userid}:
    get:
      tags: [p4-customer-compat]
      operationId: getLegacyCustomer
      summary: Resolve a WeCom external identity and read its channel-neutral customer projection
      x-legacy-mapping-ids: [LEGACY-API-0619]
      x-p4-decision-evidence: P4-B01-2026-08-15
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - { name: external_userid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
      responses:
        "200": { description: Frozen legacy customer detail envelope, content: { application/json: { schema: { $ref: "#/components/schemas/LegacyCustomerDetailResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/customers:
    get:
      tags: [p3-contact]
      operationId: listCustomers
      summary: List customers using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0609]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CustomerKeyword"
        - $ref: "#/components/parameters/OwnerStaffIDFilter"
        - $ref: "#/components/parameters/StageIDFilter"
        - $ref: "#/components/parameters/ChannelIDFilter"
        - $ref: "#/components/parameters/TagIDFilter"
        - $ref: "#/components/parameters/IsDeletedFilter"
        - $ref: "#/components/parameters/AddedAfterFilter"
        - $ref: "#/components/parameters/AddedBeforeFilter"
        - $ref: "#/components/parameters/LastInteractAfterFilter"
        - $ref: "#/components/parameters/LastInteractBeforeFilter"
      responses:
        "200":
          description: Customer page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p3-contact]
      operationId: getCustomer
      summary: Get a channel-neutral customer by OneID
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0619, LEGACY-API-0743]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [p3-contact]
      operationId: updateCustomer
      summary: Update customer-owned profile fields
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0736]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/{customer_id}/stage:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    put:
      tags: [p3-contact]
      operationId: setCustomerStage
      summary: Set or clear a customer's stage
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCustomerStageRequest"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/{customer_id}/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
      - $ref: "#/components/parameters/TagID"
    put:
      tags: [p3-contact]
      operationId: addCustomerTag
      summary: Idempotently apply one local tag to a customer
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Tag is present. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [p3-contact]
      operationId: removeCustomerTag
      summary: Idempotently remove one local tag from a customer
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.write
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Tag is absent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/customers/{customer_id}/events:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [p3-contact]
      operationId: listCustomerEvents
      summary: List append-only customer events using a keyset cursor
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0620, LEGACY-API-0739, LEGACY-API-0745]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customer.events.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customer event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEventListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tags:
    get:
      tags: [p3-contact]
      operationId: listTags
      summary: List the local tag catalog in deterministic order
      x-legacy-mapping-ids: [LEGACY-API-0551, LEGACY-API-0555]
      x-p3-decision-evidence: P3-C00-2026-08-12
      x-aicrm-capability: customers.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: owner_staff }
      responses:
        "200":
          description: Tag catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/segments:
    get:
      tags: [p3-segment]
      operationId: listSegments
      summary: List materialized audience definitions with a keyset cursor
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.read
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Segment page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [p3-segment]
      operationId: createSegment
      summary: Create one declarative audience definition
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSegmentRequest" }
      responses:
        "201":
          description: Created segment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/segments/{segment_id}:
    parameters:
      - $ref: "#/components/parameters/SegmentID"
    get:
      tags: [p3-segment]
      operationId: getSegment
      summary: Get one declarative audience definition
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.read
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      responses:
        "200":
          description: Segment definition and refresh projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [p3-segment]
      operationId: updateSegment
      summary: Update one declarative audience definition
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSegmentRequest" }
      responses:
        "200":
          description: Updated segment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/segments/{segment_id}/members:
    parameters:
      - $ref: "#/components/parameters/SegmentID"
    get:
      tags: [p3-segment]
      operationId: listSegmentMembers
      summary: Preview the current materialized members using a keyset cursor
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.read
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current materialized member page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentMemberPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/segments/{segment_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/SegmentID"
    post:
      tags: [p3-segment]
      operationId: requestSegmentRefresh
      summary: Durably request one materialized audience refresh
      x-p3-decision-evidence: P3-S00-2026-08-12
      x-aicrm-capability: segments.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Refresh command accepted; it does not prove members changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentRefreshAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/stages:
    get:
      tags: [p2-stages]
      operationId: listStages
      summary: List global customer stages in deterministic order
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.read
      x-aicrm-rbac-scopes: { admin: global, ops: global, sales: global }
      responses:
        "200":
          description: Ordered stage definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [p2-stages]
      operationId: createStage
      summary: Create one global customer stage
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStageRequest"
      responses:
        "201":
          description: Created stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/stages/{stage_id}:
    parameters:
      - $ref: "#/components/parameters/StageID"
    patch:
      tags: [p2-stages]
      operationId: renameStage
      summary: Rename one global customer stage
      x-p2-decision-evidence: P2-16-2026-08-11
      x-aicrm-capability: stages.write
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameStageRequest"
      responses:
        "200":
          description: Renamed stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/identity/resolve:
    post:
      tags: [p1-core-candidate]
      operationId: resolveIdentity
      summary: Resolve one scoped identity without implicit creation
      x-p1-signoff-status: APPROVED
      x-p1-decision-evidence: G1-D01-2026-08-10
      x-legacy-mapping-ids: [LEGACY-API-0355, LEGACY-API-0680]
      x-aicrm-capability: identity.resolve
      x-aicrm-rbac-scopes: { admin: global, ops: global }
      x-p3-decision-evidence: P3-I00-2026-08-12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIdentityRequest"
      responses:
        "200":
          description: Found, not-found, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/identity/bind:
    post:
      tags: [p1-core-candidate]
      operationId: bindIdentity
